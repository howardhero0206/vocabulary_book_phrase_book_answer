<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>單字書小考 詳解｜10-2~11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EBEE; --card:#FDFDFC;
  --ink:#10202F; --ink-2:#56687A; --ink-3:#7C8B99;
  --rule:#C6D0D8; --pen:#17457E; --hl:#FFE773; --miss:#A34234;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  --read:'Literata',Georgia,'Times New Roman',serif;
  --han:'PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  --maxw:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--han);font-size:16px;line-height:1.75}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px;border-radius:2px}

.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:14px 24px 0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.title{font-size:23px;font-weight:600;margin:0;line-height:1.3}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin:4px 0 0;letter-spacing:.04em}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px 0 11px;margin-top:10px;border-top:1px solid var(--rule)}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.04em;border:1px solid var(--rule);background:transparent;color:var(--ink-2);padding:5px 10px;border-radius:999px;cursor:pointer;text-decoration:none;transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--pen);color:var(--pen)}
.chip.solid{margin-left:auto;border-color:var(--ink);color:var(--ink);font-weight:500}
.chip.solid:hover{background:var(--ink);color:var(--card)}

.wrap{max-width:var(--maxw);margin:0 auto;padding:28px 24px 96px;display:grid;gap:36px;grid-template-columns:minmax(0,1fr) 288px}
@media (max-width:1020px){.wrap{grid-template-columns:minmax(0,1fr);gap:44px}}

.sec{margin:0 0 48px;scroll-margin-top:136px}
.sec-head{display:flex;align-items:baseline;gap:12px;padding-bottom:9px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.sec-num{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--ink-3)}
.sec-label{font-size:18px;font-weight:600;margin:0}
.sec-score{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:auto}
.sec-inst{font-size:13.5px;color:var(--ink-2);margin:9px 0 0}

.bank{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:16px 0 0}
@media (max-width:760px){.bank{grid-template-columns:repeat(2,1fr)}}
.bank-i{background:var(--card);padding:8px 10px;font-family:var(--read);font-size:14.5px}
.bank-i span{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-right:5px}
.bank-i.used{background:#F2F5F6;color:var(--ink-3)}

.passage{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--ink);padding:22px 26px;margin:18px 0 0;font-family:var(--read);font-size:16.5px;line-height:1.95;color:#1a2836}
.passage p{margin:0 0 1em}
.passage p:last-child{margin-bottom:0}
.blank{display:inline-block;min-width:70px;text-align:center;border:0;border-bottom:1.5px solid var(--ink);font-family:var(--mono);font-size:13px;color:var(--pen);cursor:pointer;background:none;padding:0 4px;line-height:1.4}
.blank:hover{background:rgba(23,69,126,.07)}
.blank.filled{font-family:var(--read);font-size:16.5px;color:var(--ink);border-bottom-color:transparent;min-width:0}
.blank sup{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-right:2px}
.zhbtn{display:block;margin:0 0 18px;background:var(--card);border:1px solid var(--rule);border-top:0;width:100%;text-align:left;padding:8px 26px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--pen);cursor:pointer}
.zhbtn:hover{color:var(--ink)}
.zhbtn::after{content:' ▾'}
.zhbtn.on::after{content:' ▴'}
.zhbox{display:none;background:#F7F9FA;border:1px solid var(--rule);border-top:0;padding:18px 26px;margin:0 0 18px;font-size:15px;line-height:1.95;color:#22323F}
.zhbox.on{display:block}
.zhbox p{margin:0 0 .9em}
.zhbox p:last-child{margin:0}

.q{background:var(--card);border:1px solid var(--rule);margin:14px 0 0;scroll-margin-top:142px}
.q-top{padding:16px 22px 14px}
.q-tag{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.q-n{font-family:var(--mono);font-size:13px;font-weight:600}
.q-kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.prompt{font-size:14.5px;line-height:1.85;color:var(--ink-2);margin:0 0 11px;padding-left:11px;border-left:2px solid var(--rule)}
.stem{font-family:var(--read);font-size:16.5px;line-height:1.85;margin:0 0 13px;color:#1a2836}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:9px;font-family:var(--read);font-size:15.5px;line-height:1.6;padding:3px 0;color:#243342}
.opt-k{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding-top:2px;flex:none}
.reveal{display:block;width:100%;text-align:left;margin-top:14px;background:none;border:0;border-top:1px dashed var(--rule);padding:11px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--pen);cursor:pointer}
.reveal:hover{color:var(--ink)}
.reveal::after{content:' ▾'}
.q.open .reveal::after{content:' ▴'}
.q.open .reveal{color:var(--ink-3)}

.body{display:none;border-top:1px solid var(--rule);background:#F7F9FA;padding:18px 22px 20px}
.q.open .body{display:block}
.ans{display:flex;align-items:baseline;gap:10px;margin:0 0 13px;flex-wrap:wrap}
.ans-k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink-3);flex:none;padding-top:2px}
.ans-v{font-family:var(--read);font-size:18px;font-weight:600}
.fills{list-style:none;margin:0 0 13px;padding:0}
.fill{display:flex;gap:11px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--rule)}
.fill-k{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none;width:26px}
.fill-w{font-family:var(--read);font-size:17px;font-weight:600;flex:none}
.fill-n{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.zh{font-size:15px;line-height:1.85;margin:0 0 14px;color:#22323F}
.why{font-size:14.5px;line-height:1.85;margin:0 0 4px;color:#22323F;border-top:1px solid var(--rule);padding-top:12px}
.lines{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.line{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.line-k{font-family:var(--mono);font-size:12.5px;flex:none;width:28px;color:var(--ink-3);padding-top:2px}
.line.right{color:var(--ink)}
.line.right .line-k{color:var(--ink);font-weight:600}
.line.right .line-k::after{content:'✓';display:block;font-size:12px;line-height:1.3}
.line.wrong .line-k{color:var(--miss);opacity:.85}
.line.wrong .line-k::after{content:'✗';display:block;font-size:12px;line-height:1.3}
.evid{margin:15px 0 0;font-family:var(--read);font-size:14.5px;line-height:1.8;color:var(--ink-2);padding-left:13px;border-left:2px solid var(--hl)}
.evid span{font-family:var(--han);font-size:11px;letter-spacing:.14em;color:var(--ink-3);display:block;margin-bottom:3px}

.hl{background-image:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 90%,transparent 90%);background-repeat:no-repeat;background-size:0% 100%;transition:background-size .55s cubic-bezier(.2,.75,.3,1);border-radius:1px}
.hl.on{background-size:100% 100%}

.sample{margin:15px 0 0;border:1px solid var(--rule);border-left:3px solid var(--ink);background:var(--card);padding:16px 20px}
.sample p:not(.note-h){font-family:var(--read);font-size:15.5px;line-height:1.9;color:#1a2836;margin:0 0 1em}
.sample p:last-child{margin-bottom:0}
.bank.wide{grid-template-columns:1fr}
.bank.wide .bank-i{font-size:15px;line-height:1.7;padding:10px 14px}
.note{margin:15px 0 0;border:1px solid var(--rule);background:var(--card);padding:13px 16px}
.note-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.note-i{margin:0;padding:9px 0 0;border-top:1px dotted var(--rule)}
.note-i:first-of-type{border-top:0;padding-top:0}
.term{font-family:var(--read);font-size:16px;font-weight:600}
.pos{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin:0 6px}
.gloss{font-size:14.5px}
.ex{font-family:var(--read);font-size:14px;color:var(--ink-2);line-height:1.7;margin:3px 0 0;display:block}
.ex i{font-family:var(--han);font-style:normal;font-size:13px;color:var(--ink-3);display:block}

.side{position:sticky;top:136px;align-self:start;max-height:calc(100vh - 164px);overflow:auto;padding-right:4px}
@media (max-width:1020px){.side{position:static;max-height:none;scroll-margin-top:136px}}
.side-h{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0 0 3px}
.side-t{font-size:16px;font-weight:600;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.card-list{margin:0;padding:0;list-style:none}
.card-item{border-bottom:1px solid var(--rule);padding:11px 0}
.card-item a{display:block;text-decoration:none;color:inherit}
.card-item a:hover .term{background:var(--hl)}
.jump{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);float:right;padding-top:5px}
.side-note{font-size:12.5px;color:var(--ink-3);line-height:1.7;margin:16px 0 0}
.foot{max-width:var(--maxw);margin:0 auto;padding:0 24px 48px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  body{background:#fff;font-size:10.5pt}
  .top,.side,.reveal,.foot,.zhbtn{display:none!important}
  .wrap{display:block;max-width:none;padding:0}
  .q .body{display:block!important}
  .zhbox{display:block!important}
  .q{break-inside:avoid;border-color:#999;margin-bottom:9pt}
  .passage{break-inside:avoid}
  .hl{background-size:100% 100%!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <p class="eyebrow" id="brand"></p>
    <h1 class="title" id="examTitle"></h1>
    <p class="meta" id="examMeta"></p>
    <nav class="bar" id="nav"></nav>
  </div>
</header>

<div class="wrap"><main id="main"></main><aside class="side" id="side"></aside></div>
<p class="foot" id="foot"></p>

<script>
/* ==========================================================================
   ①  題目與詳解全部寫在下面的 EXAM 物件裡。要改題、加題、修字，只動這裡。

   section（大題）：{ id, label, score, instruction, bank?, groups: [...] }
   group（同一篇文章的題組）：{ passage?, zh?, questions: [...] }
       passage 裡寫 __7__ 就會變成可點的空格，數字對應題號。
       zh 是全文中譯，會做成可展開的按鈕。

   question 依題型三選一：
     選擇題   { n, kind, stem, options:{A..D}, answer:"B", translation, explain:{A..D}, evidence?, notes? }
     單一填答 { n, kind, stem, answerText:"prejudice", why, notes? }
     多格填答 { n, kind, prompt, stem, answers:[{k:"①", w:"字", note:"說明"}], notes? }
   ========================================================================== */
const EXAM = {
  brand: "單字書小考",
  title: "單字書小考 詳解｜10-2~11",
  meta: "Instructor: Howard Chang　·　範圍：單字書10-2~11",
  footer: "KGHS 英文字彙字識+ Level 5【10-2~11】單字小考",
  sections: [
  {
    id:"mc", label:"Multiple Choice", score:"第 1-40 題（80%，每題 2%）",
    instruction:"依英文句子選出一個正確或最佳的答案。原卷紅字答案已逐題核對，40 題全部正確。每題附題幹中譯可中英對照，並說明四個選項各自的意思與對錯理由。",
    groups:[{
      questions:[
        { n:1, kind:"名詞",
          stem:"Having worked as a nurse for twenty years, Ms. Chen offers rare __________ into what patients really feel when they first hear bad news.",
          options:{A:"morale 士氣",B:"tension 緊張、張力",C:"insight 洞察、深刻的見解",D:"characteristic 特徵、特色"}, answer:"C",
          translation:"陳女士當了二十年護理師，因此能對病人第一次聽到壞消息時真正的感受，提出難得的深刻見解。",
          explain:{C:"✔ 空格後接介系詞 into，而 insight into sth（對…的洞察）是固定搭配；Having worked as a nurse for twenty years（當了二十年護理師）正是這種深刻見解的來源。",A:"✘ morale 是「士氣」（boost morale 提振士氣），指群體的精神狀態，不與 into 搭配。",B:"✘ tension 是「緊張、張力」（ease tension 緩解緊張），後面接 between 而不是 into。",D:"✘ characteristic 是「特徵」，後面接 of（a characteristic of sth），而且它指外顯的特質，不是對他人內心的理解。"},
          notes:[{term:"insight", pos:"n.", gloss:"洞察、深刻見解（insight into sth；gain／offer／provide insight into sth）。adj. insightful 有洞見的。字面是 in（向內）＋sight（看），「看進去」。", ex:"The documentary gives us real insight into refugee life.", exZh:"這部紀錄片讓我們真正理解難民的生活。"},{term:"Having + p.p. 分詞構句", pos:"句型", gloss:"完成式分詞構句，表示比主要動詞更早發生：Having worked as a nurse for twenty years, Ms. Chen offers…（＝Because she has worked as a nurse for twenty years…）。"}]},

        { n:2, kind:"形容詞",
          stem:"Because Tina is __________ to peanuts, she always checks the list of ingredients carefully before buying any cookies or snacks at the supermarket.",
          options:{A:"allergic 過敏的",B:"mortal 終將死亡的；致命的",C:"intent 專注的、一心一意的",D:"complex 複雜的"}, answer:"A",
          translation:"因為 Tina 對花生過敏，她在超市買任何餅乾或零食之前，總是仔細檢查成分表。",
          explain:{A:"✔ be allergic to sth（對某物過敏）是固定搭配；checks the list of ingredients carefully（仔細看成分表）正是過敏者的典型行為。",B:"✘ mortal 是「終將死亡的」（We are all mortal.）或「致命的」（a mortal wound），不與 to 搭配表達個人體質。",C:"✘ intent 的搭配是 be intent on sth／on V-ing（專注於、決心做某事），介系詞用 on 不是 to。",D:"✘ complex 是「複雜的」，修飾事物或結構（a complex problem），不能說人對花生很複雜。"},
          notes:[{term:"allergic", pos:"adj.", gloss:"過敏的（be allergic to pollen／dust；也可戲稱「極討厭」：He's allergic to hard work.）。n. allergy 過敏（第 35 題的誘答）／n. allergen 過敏原。", ex:"I'm allergic to shellfish, so I avoid seafood restaurants.", exZh:"我對帶殼海鮮過敏，所以我避開海鮮餐廳。"},{term:"ingredient", pos:"n.", gloss:"成分、原料（a list of ingredients 成分表）；也指「要素」（a key ingredient of success 成功的關鍵要素）。"}]},

        { n:3, kind:"動詞",
          stem:"No matter how busy you are, nothing can __________ shouting at a waiter who simply brought you the wrong drink by mistake.",
          options:{A:"recite 背誦、朗誦",B:"operate 操作；動手術",C:"consume 消耗、吃喝",D:"justify 證明…正當、說得過去"}, answer:"D",
          translation:"不管你有多忙，對一位只是不小心送錯飲料的服務生大吼大叫，都說不過去。",
          explain:{D:"✔ justify 是「使…顯得正當、說得過去」，受詞可以是動名詞（justify V-ing）。nothing can justify…（沒有什麼能為…找到正當理由）是道德判斷的標準說法，與 No matter how busy you are（不管你多忙）的讓步語氣完全呼應。",A:"✘ recite 是「背誦」（recite a poem），受詞是文本，不能接 shouting。",B:"✘ operate 是「操作（機器）」或「開刀」（operate on a patient），受詞或介系詞都不符。",C:"✘ consume 是「消耗、食用」（consume energy／calories），無法接「大吼」這個行為。"},
          notes:[{term:"justify", pos:"v.", gloss:"使正當化、為…辯解（justify one's actions／justify V-ing；The end justifies the means. 為達目的不擇手段）。n. justification 正當理由；adj. justified 有正當理由的；對照第 26 題的誘答 justice 正義。", ex:"Nothing can justify cheating on an exam.", exZh:"考試作弊沒有任何理由說得過去。"},{term:"No matter how…", pos:"句型", gloss:"不管多麼…（No matter how busy you are＝However busy you are）。注意形容詞緊跟在 how 之後，不可拆開。"}]},

        { n:4, kind:"名詞",
          stem:"Hardly had the __________ broken out when schools and theaters across the city were ordered to close, and everyone was required to wear a mask outdoors.",
          options:{A:"syndrome 症候群",B:"epidemic 流行病、疫情",C:"nutrition 營養（學）",D:"digestion 消化"}, answer:"B",
          translation:"疫情才剛爆發，全市的學校與戲院就被要求關閉，所有人在戶外都必須戴口罩。",
          explain:{B:"✔ break out（爆發）的主詞必須是突然大規模發生的事（war, fire, epidemic, riot）；後文 schools and theaters…ordered to close（學校戲院關閉）與 wear a mask outdoors（戶外戴口罩）更是疫情的標準反應。",A:"✘ syndrome 是「症候群」，指一組同時出現的症狀組合（Down syndrome 唐氏症），是醫學分類名稱，不會「爆發」。",C:"✘ nutrition 是「營養」，是抽象概念，不能 break out。",D:"✘ digestion 是「消化」，身體的生理過程，同樣不能爆發。"},
          notes:[{term:"epidemic", pos:"n. / adj.", gloss:"流行病、疫情（a flu epidemic／an epidemic of obesity 肥胖的流行）。規模更大的是 pandemic 全球大流行；endemic 則指「地方性流行的」。", ex:"The city managed to contain the epidemic within three weeks.", exZh:"這座城市在三週內成功控制住了疫情。"},{term:"Hardly had S p.p. when…", pos:"句型", gloss:"「才剛…就…」。否定副詞 Hardly 置句首必須倒裝，且主句用過去完成式、when 子句用過去式。同型：No sooner had he arrived than…／Scarcely had she spoken when…。"},{term:"break out", pos:"片語", gloss:"（戰爭、火災、疫病）爆發（War broke out in 1939.）；也指 break out in a rash 起疹子。n. outbreak 爆發（an outbreak of measles）。"}]},

        { n:5, kind:"形容詞",
          stem:"It was __________ of Amy to believe a stranger online who promised her a free phone; she paid the shipping fee, but nothing ever arrived.",
          options:{A:"rational 理性的",B:"naive 天真的、容易輕信的",C:"worldly 世故的、歷練深的",D:"cautious 謹慎的"}, answer:"B",
          translation:"Amy 竟然相信網路上一個承諾送她免費手機的陌生人，實在太天真了；她付了運費，東西卻一直沒送到。",
          explain:{B:"✔ 分號後面說明結果：she paid the shipping fee, but nothing ever arrived（付了運費卻什麼都沒收到），這是被騙，所以對她的評價是「太容易輕信」，正是 naive。句型 It is＋adj.＋of sb to V 用於評價人的行為。",A:"✘ rational 是「理性的」，相信網路陌生人送免費手機恰恰是不理性，語意相反。",C:"✘ worldly 是「世故的、閱歷豐富的」，世故的人不會上這種當，語意相反。",D:"✘ cautious 是「謹慎的」，與輕易相信陌生人完全矛盾。"},
          notes:[{term:"naive", pos:"adj.", gloss:"天真的、容易輕信的（讀 /naɪˈiːv/，法文借字；be naive to think that…）。n. naivety／naiveté 天真。相關：gullible 容易上當的／credulous 輕信的／innocent 無辜的、純真的（第 19 題的誘答）。", ex:"It would be naive to believe everything politicians promise.", exZh:"相信政治人物承諾的一切，那就太天真了。"},{term:"It is + adj. + of sb to V", pos:"句型", gloss:"評價「人」的句型（It was naive of her to…／It was kind of you to help.）；對照 It is + adj. + for sb to V 評價「事情本身」（It is difficult for her to…）。"}]},

        { n:6, kind:"動詞",
          stem:"Only after running a series of tests did the doctors __________ her with a rare disease that affects just one in a million people.",
          options:{A:"diagnose 診斷",B:"infect 使感染",C:"subject 使遭受",D:"control 控制"}, answer:"A",
          translation:"醫師在做了一連串檢查之後，才診斷出她罹患一種百萬人中僅一人會得的罕見疾病。",
          explain:{A:"✔ diagnose sb with sth（診斷某人患有某病）是固定搭配，空格後正是 her with a rare disease；前面 Only after running a series of tests（做了一連串檢查之後）說明這是確診的過程。",B:"✘ infect 是「使感染」（be infected with a virus），主詞應是病原或帶原者，而醫師做檢查不是在傳染疾病給病人。",C:"✘ subject 的搭配是 subject sb to sth（使某人遭受），介系詞是 to 不是 with。",D:"✘ control 是「控制」，後面直接接受詞（control the disease），不接 sb with sth；而且檢查的目的是找出病名，不是控制。"},
          notes:[{term:"diagnose", pos:"v.", gloss:"診斷（diagnose sb with sth／be diagnosed with cancer／diagnose the problem 找出問題所在）。n. diagnosis 診斷（複數 diagnoses）；adj. diagnostic 診斷用的。", ex:"She was diagnosed with type 1 diabetes at the age of nine.", exZh:"她九歲時被診斷出罹患第一型糖尿病。"},{term:"Only after… 倒裝", pos:"句型", gloss:"Only＋副詞片語或子句置句首，主句必須倒裝：Only after running tests did the doctors diagnose…。同型：Only then did I realize…／Only in this way can we succeed.。"},{term:"one in a million", pos:"片語", gloss:"百萬中之一（表機率極低，或形容人極為難得：She's one in a million.）。"}]},

        { n:7, kind:"名詞",
          stem:"What impressed the judges most about Kevin's design was its __________; no one had ever thought of turning old umbrellas into a tent.",
          options:{A:"mortality 死亡率；必死性",B:"pessimism 悲觀（主義）",C:"tactic 戰術、策略手段",D:"originality 原創性、獨創"}, answer:"D",
          translation:"Kevin 的設計最讓評審印象深刻的，是它的原創性；從來沒有人想過把舊雨傘改造成帳篷。",
          explain:{D:"✔ 分號後面就是定義：no one had ever thought of…（從來沒有人想過），這正是「原創性」。評審對設計最讚賞的特質用 originality 完全對應。",A:"✘ mortality 是「死亡率」（the infant mortality rate 嬰兒死亡率），與設計評比無關。",B:"✘ pessimism 是「悲觀」，是心理傾向而非作品特質，也無法解釋「沒人想過」。",C:"✘ tactic 是「戰術、手段」，指達成目的的方法（a delaying tactic 拖延戰術），不是作品的創意價值。"},
          notes:[{term:"originality", pos:"n.", gloss:"原創性、獨創（lack originality 缺乏原創性）。adj. original 原創的、最初的；n. origin 起源；v. originate 起源（originate in／from sth，不及物）。", ex:"The novel was praised for its startling originality.", exZh:"這本小說因其驚人的原創性而備受讚譽。"},{term:"What 引導名詞子句當主詞", pos:"句型", gloss:"What impressed the judges most was its originality.（＝The thing that impressed the judges most…）。注意 what 子句視為單數，動詞用 was。"}]},

        { n:8, kind:"形容詞",
          stem:"Of all the guests at the party, Linda was the only one who stayed __________, so she offered to drive the others home.",
          options:{A:"drunk 喝醉的",B:"crazy 瘋狂的",C:"sober 沒喝酒的、清醒的",D:"mean 小氣的、刻薄的"}, answer:"C",
          translation:"派對上所有客人當中，只有 Linda 全程沒有喝酒，所以她主動提議開車送其他人回家。",
          explain:{C:"✔ so she offered to drive the others home（因此她提議開車送大家回家）是結果，原因只能是她沒喝酒、意識清楚，正是 sober。stay sober 是固定搭配。",A:"✘ drunk 是「喝醉的」，喝醉的人不可能開車送別人回家，語意完全相反。",B:"✘ crazy 是「瘋狂的」，與能否安全開車無直接關聯，也不是派對上區分客人的條件。",D:"✘ mean 是「小氣、刻薄」，主動送人回家正好相反。"},
          notes:[{term:"sober", pos:"adj. / v.", gloss:"adj. 沒喝酒的、清醒的（stay／remain sober）；也指「嚴肅冷靜的」（a sober assessment 冷靜的評估）／v. sober up 酒醒（第 24 題的誘答 sobered 即此字）。n. sobriety 清醒、節制。", ex:"Someone has to stay sober and drive everyone home.", exZh:"總得有人保持清醒負責開車送大家回家。"},{term:"Of all…, S was the only one who…", pos:"句型", gloss:"在所有…之中，只有…（Of all the applicants, he was the only one who had field experience.）。"}]},

        { n:9, kind:"名詞",
          stem:"Spinach is rich in iron and other important __________ that help our bodies produce healthy blood, which is why doctors often recommend it.",
          options:{A:"nutrients 營養素",B:"veins 血管、靜脈",C:"scars 疤痕",D:"thighs 大腿"}, answer:"A",
          translation:"菠菜富含鐵質與其他重要的營養素，能幫助身體製造健康的血液，這就是醫師常推薦它的原因。",
          explain:{A:"✔ iron（鐵質）本身就是一種營養素，所以 other important ______ 必須是能把鐵質涵蓋進去的上層類別，正是 nutrients；be rich in nutrients（富含營養素）也是固定搭配。",B:"✘ vein 是「血管、靜脈」，是人體構造而非食物裡的成分，菠菜不會含有血管。",C:"✘ scar 是「疤痕」，與營養無關。",D:"✘ thigh 是「大腿」，同樣是身體部位，不可能存在於菠菜中。"},
          notes:[{term:"nutrient", pos:"n.", gloss:"營養素（essential nutrients 必需營養素／nutrient-rich 營養豐富的）。字族：nutrition 營養（第 4 題的誘答）／nutritious 有營養的（第 31 題的誘答）／nutritional 營養方面的（第 19 題的誘答）／nutritionist 營養師（第 35 題的誘答）／malnutrition 營養不良（第 39 題的誘答）。", ex:"Processed foods often lose many of their original nutrients.", exZh:"加工食品常會流失許多原有的營養素。"},{term:"be rich in", pos:"片語", gloss:"富含（be rich in protein／vitamin C／fiber）。同義：be high in／be packed with／be loaded with。反義：be low in／be deficient in 缺乏。"}]},

        { n:10, kind:"動詞",
          stem:"If your cough __________ for more than two weeks, you should see a doctor instead of simply buying more syrup at the drugstore.",
          options:{A:"tightens 使變緊、繃緊",B:"objects 反對",C:"persists 持續不消、遲遲不退",D:"sprains 扭傷"}, answer:"C",
          translation:"如果你的咳嗽持續超過兩週，就該去看醫生，而不是只在藥局再買一瓶糖漿。",
          explain:{C:"✔ for more than two weeks（超過兩週）是時間長度，需要一個表「持續」的動詞；persist 專指症狀或問題「遲遲不消」，而且是不及物動詞，空格後沒有受詞正好符合。這也解釋了為何該就醫。",A:"✘ tighten 是「使變緊」（tighten a screw／one's grip），受詞是物體，咳嗽不會變緊。",B:"✘ object 是「反對」（object to sth），主詞必須是人，咳嗽不會反對。",D:"✘ sprain 是「扭傷」（sprain one's ankle），及物且受詞是關節，與咳嗽無關。"},
          notes:[{term:"persist", pos:"v.", gloss:"① （問題、症狀）持續存在（If the pain persists, consult a doctor.）② persist in V-ing 堅持做（persist in denying it）。n. persistence 堅持、持續；adj. persistent 持續不斷的（a persistent cough）。", ex:"If symptoms persist for more than a week, seek medical advice.", exZh:"若症狀持續超過一週，請就醫諮詢。"},{term:"syrup", pos:"n.", gloss:"糖漿、藥水（cough syrup 止咳糖漿）。相關：drugstore／pharmacy 藥局／painkiller 止痛藥（第 30 題）／dose 劑量。"}]},

        { n:11, kind:"名詞",
          stem:"The two bank clerks were arrested for a clever __________ to steal small amounts from thousands of accounts, hoping no customer would notice.",
          options:{A:"trait （人格）特質",B:"scheme 計謀、（不法的）計畫",C:"viewpoint 觀點、看法",D:"morality 道德（觀）"}, answer:"B",
          translation:"這兩名銀行行員因為一項精巧的計謀被逮捕：他們從數千個帳戶中各偷取小額款項，希望沒有客戶會察覺。",
          explain:{B:"✔ were arrested（被逮捕）說明這是不法行為，而空格後的不定詞 to steal small amounts from thousands of accounts 正說明這個計畫的目的。scheme 指經過設計的計畫，常帶不法或詭計的意味，與 clever 搭配尤其自然。",A:"✘ trait 是「人格特質」（a personality trait），是天生或長期的性格，不會後接 to V 說明目的。",C:"✘ viewpoint 是「觀點」，是看法而非行動計畫，無法用來偷錢。",D:"✘ morality 是「道德」，抽象價值概念，不能被設計執行，也無法被逮捕。"},
          notes:[{term:"scheme", pos:"n. / v.", gloss:"n. 計謀、方案（a get-rich-quick scheme 快速致富的騙局／a pension scheme 退休金計畫，英式中性用法）／v. 謀劃（scheme to V／scheme against sb）。adj. scheming 工於算計的。", ex:"Police uncovered a scheme to defraud elderly investors.", exZh:"警方破獲一項詐騙年長投資人的計謀。"},{term:"clerk", pos:"n.", gloss:"行員、職員、店員（a bank clerk／a desk clerk 櫃檯人員）。相關：teller 銀行出納員／account 帳戶／embezzle 挪用公款。"}]},

        { n:12, kind:"形容詞",
          stem:"It is no wonder that Grandpa is always in a bad mood; he has suffered from __________ back pain for over a decade.",
          options:{A:"acute 急性的；劇烈的",B:"sane 精神正常的、理智的",C:"wary 警惕的、提防的",D:"chronic 慢性的、長期不癒的"}, answer:"D",
          translation:"難怪爺爺總是心情不好；他的慢性背痛已經折磨他十多年了。",
          explain:{D:"✔ for over a decade（超過十年）加上現在完成式 has suffered，說明這是長期持續的病痛，正是 chronic。chronic pain 是標準醫學搭配。",A:"✘ acute 是「急性的」，指發作急、病程短（acute appendicitis 急性盲腸炎），與「十多年」在時間概念上正好相反，是本題最主要的陷阱。",B:"✘ sane 是「精神正常的」，修飾人而非疼痛。",C:"✘ wary 是「警惕的」（be wary of strangers），描述心態，也不能修飾 pain。"},
          notes:[{term:"chronic / acute", pos:"辨析", gloss:"chronic 慢性的、長期的（chronic pain／illness／unemployment／a chronic shortage 長期短缺）／acute 急性的、劇烈的（acute pain／an acute shortage 嚴重短缺）。兩字也都可修飾問題：chronic 強調久、acute 強調猛。adv. chronically。", ex:"Nearly one in four adults lives with some form of chronic illness.", exZh:"將近四分之一的成年人患有某種慢性疾病。"},{term:"It is no wonder that…", pos:"句型", gloss:"難怪…（It's no wonder (that) she's tired.）。that 可省略；同義：No wonder…／It comes as no surprise that…。"}]},

        { n:13, kind:"副詞",
          stem:"Nobody answered the door, yet the lights were on and dinner was still on the table, so the Wangs had __________ left in a hurry.",
          options:{A:"presumably 想必、大概（依推測）",B:"genetically 在基因上",C:"strategically 在策略上",D:"clinically 在臨床上"}, answer:"A",
          translation:"沒有人來應門，但燈還亮著、晚餐還擺在桌上，所以王家人想必是匆忙離開的。",
          explain:{A:"✔ 整句是從現場跡象（燈亮著、飯菜還在桌上）推論出結論（匆忙離開），因此需要一個表「推測」的副詞。presumably 正是「根據可見證據推斷、想必」。",B:"✘ genetically 是「在基因上」（genetically modified 基因改造的），與離家的方式無關。",C:"✘ strategically 是「策略上」（strategically located 位置具戰略性），但匆忙離開恰恰不是策略安排。",D:"✘ clinically 是「臨床上」（clinically proven 經臨床證實），屬醫學語境，放在這裡不合。"},
          notes:[{term:"presumably", pos:"adv.", gloss:"想必、大概（Presumably she knows about it by now.）。v. presume 推定（第 36 題的誘答）；n. presumption。同類推測副詞：apparently 看來／seemingly 似乎／supposedly 據說／allegedly 據稱。", ex:"The lights are off, so presumably they've gone to bed.", exZh:"燈都關了，想必他們已經去睡了。"},{term:"in a hurry", pos:"片語", gloss:"匆忙地（leave in a hurry／be in a hurry to V 急著做某事）；also in no hurry 不急。"}]},

        { n:14, kind:"名詞",
          stem:"The nurse placed two fingers on the old man's wrist to check his __________, which was beating much faster than normal.",
          options:{A:"spine 脊椎",B:"gut 腸子；膽量",C:"fever 發燒",D:"pulse 脈搏"}, answer:"D",
          translation:"護理師把兩根手指放在老先生的腕部，檢查他的脈搏；脈搏跳動得比正常快了許多。",
          explain:{D:"✔ placed two fingers on the…wrist（把手指放在腕部）是量脈搏的標準動作，而關係子句 which was beating（在跳動）更確定了答案：會跳的是脈搏。",A:"✘ spine 是「脊椎」，位置在背部，不在手腕，也不能用兩指按壓量測。",B:"✘ gut 是「腸子」或引申的「膽量」（第 16 題考的就是 guts），不在手腕，也不會 beat。",C:"✘ fever 是「發燒」，量體溫要用額溫或耳溫，不會按在手腕上，而且發燒不會 beat。"},
          notes:[{term:"pulse", pos:"n. / v.", gloss:"脈搏、脈動（take／check sb's pulse 量脈搏／a rapid pulse 脈搏急促）／v. 搏動（music pulsing through the room）。相關：heart rate 心率／blood pressure 血壓／artery 動脈（第 29 題的誘答）／vein 靜脈（第 9 題的誘答）。", ex:"The paramedic checked for a pulse before starting CPR.", exZh:"救護員在開始施行心肺復甦術前先確認有無脈搏。"},{term:"wrist", pos:"n.", gloss:"手腕。身體部位整理：wrist 手腕／ankle 腳踝／thigh 大腿（第 9 題）／rib 肋骨（第 16 題）／skull 顱骨（第 20 題）／spine 脊椎。"}]},

        { n:15, kind:"形容詞",
          stem:"Mr. Lee is not only knowledgeable but also __________; his clever jokes keep the whole class laughing, even during dull grammar lessons.",
          options:{A:"serious 嚴肅的",B:"witty 機智幽默的",C:"careful 小心的",D:"insane 瘋狂的、精神失常的"}, answer:"B",
          translation:"李老師不只學識豐富，而且很機智幽默；他巧妙的笑話讓全班笑聲不斷，就連枯燥的文法課也一樣。",
          explain:{B:"✔ 分號後面是直接說明：his clever jokes keep the whole class laughing（巧妙的笑話讓全班大笑），這正是 witty（機智幽默，笑點來自聰明的用詞或聯想）。",A:"✘ serious 是「嚴肅的」，與講笑話讓全班笑的描述相矛盾。",C:"✘ careful 是「小心的」，與幽默感無關，也無法由 clever jokes 推得。",D:"✘ insane 是「瘋狂的、精神失常的」，語氣是負面病理，不是對老師的讚美；對照第 8 題的 sane（精神正常的）。"},
          notes:[{term:"witty", pos:"adj.", gloss:"機智幽默的（a witty remark／reply；a witty speaker）。n. wit 機智、風趣（a quick wit 反應機敏／be at one's wits' end 束手無策）。相關：humorous 幽默的／sarcastic 諷刺的／dry humor 冷幽默。", ex:"Her witty comeback had everyone in the room laughing.", exZh:"她機智的回嘴讓滿屋子的人都笑了。"},{term:"not only A but also B", pos:"句型", gloss:"不只 A 而且 B；A 與 B 詞性必須對等（此處 knowledgeable 與 witty 都是形容詞）。置句首時 not only 之後要倒裝：Not only is he knowledgeable, but…。"}]},

        { n:16, kind:"名詞",
          stem:"It takes real __________ to admit your mistake in front of the whole class, especially when everyone is already laughing at you.",
          options:{A:"bones 骨頭",B:"herbs 草藥、香草",C:"guts 膽量、勇氣",D:"ribs 肋骨"}, answer:"C",
          translation:"要在全班面前承認自己的錯誤需要真正的膽量，尤其是當大家已經在笑你的時候。",
          explain:{C:"✔ It takes guts to V（做某事需要膽量）是固定說法；當眾承認錯誤、而且還在被取笑，需要的正是勇氣。注意此義恆用複數 guts。",A:"✘ bones 是「骨頭」，雖有 feel sth in one's bones（直覺感到）的用法，但不能說需要骨頭。",B:"✘ herbs 是「草藥、香草」，與勇氣無關。",D:"✘ ribs 是「肋骨」，身體構造；相關片語 ribbing 是「調侃」，但 ribs 本身不表勇氣。"},
          notes:[{term:"guts", pos:"n.", gloss:"膽量、勇氣（It takes guts to V／have the guts to V／a gutsy performance 有膽識的表現）。單數 gut 指腸子或「直覺」（a gut feeling 直覺／go with your gut 憑直覺）。第 14 題的誘答即此字。", ex:"It took real guts to stand up and disagree with the boss.", exZh:"站起來跟老闆唱反調需要真正的膽量。"},{term:"It takes + N + to V", pos:"句型", gloss:"做某事需要（某種特質或資源）：It takes courage／patience／time／two hours to…。相關：It takes two to tango 一個巴掌拍不響。"}]},

        { n:17, kind:"名詞",
          stem:"The film challenges the __________ that scientists are shy men in white coats by telling the story of a bold female biologist who studies sharks.",
          options:{A:"stereotype 刻板印象",B:"equipment 設備、裝備",C:"injection 注射",D:"backbone 脊骨；骨氣、中堅"}, answer:"A",
          translation:"這部電影藉由講述一位研究鯊魚的大膽女性生物學家的故事，挑戰了「科學家都是穿白袍的害羞男性」這種刻板印象。",
          explain:{A:"✔ 空格後是 that 同位語子句（that scientists are shy men in white coats），內容正是一種以偏概全的既定印象，而 challenge a stereotype（挑戰刻板印象）是標準搭配；後面以一位大膽女性科學家為例，正是對該印象的反證。",B:"✘ equipment 是「設備」，不可數且不能接 that 同位語說明內容。",C:"✘ injection 是「注射」（第 24 題的 injected 是其動詞），是醫療動作而非觀念。",D:"✘ backbone 雖可引申為「骨氣」或「（組織的）中堅」，但不會後接 that 子句，也不是可被挑戰的觀念。"},
          notes:[{term:"stereotype", pos:"n. / v.", gloss:"n. 刻板印象（challenge／reinforce／break a stereotype）／v. 對…抱持刻板印象（be stereotyped as sth，第 32 題的誘答即此字）。adj. stereotypical 典型化的。相關：prejudice 偏見／bias 偏誤／generalization 以偏概全。", ex:"The campaign aims to break down gender stereotypes in engineering.", exZh:"這項倡議旨在打破工程領域的性別刻板印象。"},{term:"challenge", pos:"v.", gloss:"此處是「質疑、挑戰（觀念）」（challenge an assumption／a ruling／sb's authority），不是「向某人挑戰比賽」。n. challenge 挑戰、難題。"}]},

        { n:18, kind:"片語動詞",
          stem:"Half of my classmates __________ the flu during exam week, so the teacher agreed to postpone the test until everyone had recovered.",
          options:{A:"threw up 嘔吐",B:"set about 著手開始（做）",C:"embarked on 展開（旅程、計畫）",D:"came down with 染上（病）"}, answer:"D",
          translation:"考試週時我有一半的同學得了流感，所以老師同意把考試延後到大家都康復為止。",
          explain:{D:"✔ come down with＋疾病是「染上（感冒、流感等不嚴重的病）」的固定片語，受詞 the flu 完全對應；後文 until everyone had recovered（直到大家康復）更確認是生病。",A:"✘ throw up 是「嘔吐」，不及物，不能接 the flu 當受詞（會變成「吐出流感」）。",B:"✘ set about 是「著手開始做某事」，後面接動名詞（set about cleaning the room），不接疾病。",C:"✘ embark on 是「展開（計畫、旅程、新生活）」，受詞是刻意開始的事（embark on a career），沒有人會主動「展開流感」。"},
          notes:[{term:"come down with", pos:"片語動詞", gloss:"染上（較輕的疾病）（come down with a cold／the flu／a fever）。對照：contract a disease（正式，較重的病）／catch a cold（口語）／be diagnosed with（確診，第 6 題）。", ex:"I think I'm coming down with something — my throat hurts.", exZh:"我覺得自己好像要生病了，喉嚨很痛。"},{term:"postpone", pos:"v.", gloss:"延期（postpone sth until／to＋時間；postpone V-ing）。同義：put off／delay／reschedule。注意後接動名詞不接不定詞。"}]},

        { n:19, kind:"形容詞",
          stem:"Modern cars are equipped with such __________ computer systems that ordinary mechanics often cannot repair them without special training and tools.",
          options:{A:"temporary 暫時的",B:"innocent 無辜的、天真的",C:"sophisticated 精密複雜的；老練世故的",D:"nutritional 營養（方面）的"}, answer:"C",
          translation:"現代汽車配備的電腦系統如此精密複雜，以致於一般技師沒有特殊訓練與工具往往修不來。",
          explain:{C:"✔ such…that 句型中，that 子句的結果是 ordinary mechanics…cannot repair them without special training and tools（一般技師沒有特訓與工具修不來），原因必然是系統極為精密複雜，正是 sophisticated。",A:"✘ temporary 是「暫時的」，無法解釋為什麼需要特殊訓練才能維修。",B:"✘ innocent 是「無辜的、天真的」，用於人或表情，不能修飾電腦系統。",D:"✘ nutritional 是「營養方面的」（nutritional value 營養價值），屬食品語境，與汽車電腦完全無關。"},
          notes:[{term:"sophisticated", pos:"adj.", gloss:"① （技術、設備）精密複雜的（sophisticated equipment／software／techniques）② （人）老練世故、有品味的（a sophisticated traveler）。n. sophistication。對照 complex 複雜的（第 2 題的誘答，中性）／complicated 複雜難懂的（偏負面）。", ex:"The lab uses highly sophisticated imaging equipment.", exZh:"這間實驗室使用高度精密的影像設備。"},{term:"such + (a) + adj. + N + that…", pos:"句型", gloss:"如此…以致於…（such sophisticated systems that…／such a good film that…）。對照 so＋adj.＋that（so sophisticated that…）：so 直接接形容詞，such 要接名詞。"}]},

        { n:20, kind:"名詞",
          stem:"Not until the next morning did Tony notice the large purple __________ on his knee, which he must have gotten when he fell off his bike.",
          options:{A:"tumor 腫瘤",B:"bruise 瘀青、瘀傷",C:"skull 顱骨、頭骨",D:"hormone 荷爾蒙、激素"}, answer:"B",
          translation:"直到隔天早上 Tony 才注意到膝蓋上那一大塊紫色的瘀青，那肯定是他從單車上跌下來時撞出來的。",
          explain:{B:"✔ large purple（一大塊紫色的）是瘀青最典型的外觀，而關係子句 which he must have gotten when he fell off his bike（從單車跌下來時造成的）說明是撞擊所致，正是 bruise。",A:"✘ tumor 是「腫瘤」，是組織異常增生，不會因跌倒隔夜出現，也不是紫色外觀。",C:"✘ skull 是「顱骨」，在頭部不在膝蓋，而且骨頭不會「出現」在皮膚上。",D:"✘ hormone 是「荷爾蒙」，體內的化學物質，看不見也不會長在膝蓋上。"},
          notes:[{term:"bruise", pos:"n. / v.", gloss:"n. 瘀青（get／have a bruise；be covered in bruises）／v. 使瘀傷、（水果）碰傷（bruise easily 容易瘀青，第 24 題的誘答即此字）。adj. bruised。相關：swell 腫起／sprain 扭傷（第 10 題）／scar 疤痕（第 9、40 題的誘答）。", ex:"She had a nasty bruise on her elbow after the fall.", exZh:"她跌倒後手肘上有一塊嚴重的瘀青。"},{term:"Not until… 倒裝", pos:"句型", gloss:"Not until＋時間置句首，主句倒裝：Not until the next morning did Tony notice…。另一種寫法是分裂句：It was not until the next morning that Tony noticed…（見第 39 題）。"},{term:"must have + p.p.", pos:"句型", gloss:"對過去的強烈推測「一定是…」（He must have forgotten.）。對照 can't have p.p. 不可能…／should have p.p. 早該…。"}]},

        { n:21, kind:"動詞",
          stem:"With the singer refusing to explain her sudden retirement, fans can only __________ about the real reasons behind her decision to leave the stage.",
          options:{A:"speculate 推測、揣測",B:"disable 使失能、使無法運作",C:"reject 拒絕、駁回",D:"contract 感染（疾病）；簽約；收縮"}, answer:"A",
          translation:"由於這位歌手拒絕解釋她突然退休的原因，粉絲只能揣測她決定離開舞台背後真正的理由。",
          explain:{A:"✔ 空格後接介系詞 about，而 speculate about／on sth（揣測某事）是固定搭配；前提 refusing to explain（拒絕解釋）說明資訊不明，所以只能猜，正是 speculate。",B:"✘ disable 是及物動詞「使失能」（disable a function／be disabled by illness），不接 about。",C:"✘ reject 是及物動詞「拒絕」，後面直接接受詞（reject a proposal），不接 about，而且粉絲並不是在拒絕什麼。",D:"✘ contract 是「感染（疾病）、簽約、收縮」，三個意思都及物或不接 about，語意也不合。"},
          notes:[{term:"speculate", pos:"v.", gloss:"① 推測、揣測（speculate about／on sth；speculate that…）② 投機買賣（speculate in stocks）。n. speculation 推測、投機；adj. speculative 推測性的、投機的。", ex:"Commentators speculated about who would replace the coach.", exZh:"評論者紛紛揣測誰會接替這位教練。"},{term:"With + O + V-ing", pos:"句型", gloss:"附帶狀況的獨立結構：With the singer refusing to explain…（＝Since the singer refuses to explain…）。受詞與分詞之間是主動關係用 V-ing，被動則用 p.p.（With the work done…）。"}]},

        { n:22, kind:"名詞",
          stem:"Caring for three young children while working full-time has put a great __________ on their marriage, and the couple now argue almost every night.",
          options:{A:"medication 藥物（治療）",B:"plot 情節；陰謀",C:"strain 壓力、緊張關係、負擔",D:"idea 想法"}, answer:"C",
          translation:"一邊全職工作一邊照顧三個年幼的孩子，給他們的婚姻帶來極大的壓力，這對夫妻現在幾乎每晚都在吵架。",
          explain:{C:"✔ put a strain on sth（給…帶來壓力、負擔）是固定搭配；結果 argue almost every night（幾乎每晚吵架）正是婚姻關係緊繃的表現。",A:"✘ medication 是「藥物」，不會用 put…on a marriage 的結構。",B:"✘ plot 是「情節、陰謀」，與夫妻的疲累負擔無關。",D:"✘ idea 雖是名詞，但 put a great idea on their marriage 不成搭配，也無法導致每晚吵架。"},
          notes:[{term:"strain", pos:"n. / v.", gloss:"n. 壓力、緊張關係（put／place a strain on sth；be under strain）；也指拉傷（a muscle strain）／v. 拉傷、使緊繃（strain one's back／strain relations 使關係緊張）。對照第 23 題的 vulnerable 與第 12 題的 chronic，都是壓力相關字彙。", ex:"The sudden drop in income put a strain on the whole family.", exZh:"收入驟減給整個家庭帶來很大的壓力。"},{term:"care for", pos:"片語", gloss:"照顧（care for the elderly）；也指「喜歡」（I don't care for coffee.）。n. caregiver 照顧者／caretaker 看管人。"}]},

        { n:23, kind:"形容詞",
          stem:"Old computers that are no longer updated are __________ to hackers, who can easily break in and steal their users' passwords and bank details.",
          options:{A:"reasonable 合理的、講理的",B:"experienced 有經驗的",C:"determined 有決心的",D:"vulnerable 易受攻擊的、脆弱的"}, answer:"D",
          translation:"不再更新的舊電腦很容易被駭客攻破，駭客可以輕易入侵並竊取使用者的密碼與銀行資料。",
          explain:{D:"✔ be vulnerable to sth（易受…侵害）是固定搭配，空格後正是 to hackers；關係子句 who can easily break in（能輕易入侵）說明了這種脆弱性的後果。",A:"✘ reasonable 是「合理的」，修飾價格、要求或人的態度，不與 to hackers 搭配。",B:"✘ experienced 是「有經驗的」，應該用來形容駭客而非電腦，而且搭配是 be experienced in sth。",C:"✘ determined 是「有決心的」，主詞必須是人（be determined to V），電腦沒有決心。"},
          notes:[{term:"vulnerable", pos:"adj.", gloss:"易受傷害的、脆弱的（be vulnerable to attack／criticism／flooding；vulnerable groups 弱勢族群）。n. vulnerability 脆弱性、（資安）漏洞。對照第 34、38 題：be immune to 不受影響／be prone to 易於發生，三個都接 to，是本卷的重點介系詞群。", ex:"Unpatched systems remain vulnerable to ransomware attacks.", exZh:"未修補的系統仍然容易遭受勒索軟體攻擊。"},{term:"break in / break into", pos:"片語", gloss:"（非法）入侵、破門而入（break into a house／a computer system）。n. a break-in 入侵事件。相關：hack 駭入／breach 資料外洩／malware 惡意軟體。"}]},

        { n:24, kind:"動詞（過去式）",
          stem:"Had it not been for the new coach, who __________ fresh energy into the team, the players would never have won the championship.",
          options:{A:"bruised 使瘀傷",B:"injected 注入、挹注",C:"coughed 咳嗽",D:"sobered 使酒醒、使清醒"}, answer:"B",
          translation:"要不是這位為球隊注入新活力的新教練，球員們絕不可能贏得冠軍。",
          explain:{B:"✔ 空格後是 fresh energy into the team，需要一個搭配 into 的及物動詞。inject A into B 原指「把藥劑注入體內」，引申為「為…注入（資金、活力、新意）」，正是此處的用法。",A:"✘ bruise 是「使瘀傷」，受詞是身體部位或水果，不能接 energy。",C:"✘ cough 是「咳嗽」，不及物（cough up sth 才是「勉強交出」），接不上 energy into the team。",D:"✘ sober 是「使清醒」（sober up），受詞是人，而且語意與「注入活力」不同。"},
          notes:[{term:"inject", pos:"v.", gloss:"① 注射（inject a drug into a vein）② 注入、挹注（inject cash／new life／humor into sth）。n. injection 注射、挹注（a cash injection 資金挹注；第 17 題的誘答即此字）。", ex:"The grant injected much-needed funds into the program.", exZh:"這筆補助為該計畫挹注了亟需的資金。"},{term:"Had it not been for…", pos:"句型", gloss:"倒裝的第三類假設，「要不是…」（＝If it had not been for…／But for…／Without…）。主句用 would have p.p.：Had it not been for the coach, they would never have won.。"}]},

        { n:25, kind:"動詞",
          stem:"Instead of just complaining about the traffic, the new mayor has promised to __________ the problem by building two more subway lines before 2030.",
          options:{A:"mumble 咕噸、含糊地說",B:"assume 假定；承擔（職責）",C:"tackle 著手處理、對付（難題）",D:"project 投射；預估"}, answer:"C",
          translation:"新市長承諾不只是抱怨交通問題，而要透過在 2030 年前再建兩條地鐵線來著手解決這個問題。",
          explain:{C:"✔ tackle a problem（著手處理問題）是固定搭配，而 by building two more subway lines（透過再建兩條地鐵線）說明了具體作法，與 Instead of just complaining（而不只是抱怨）形成「光說不如實做」的對比。",A:"✘ mumble 是「咕噸」，受詞是話語，不能處理問題（第 40 題的誘答 mutter 與它同類）。",B:"✘ assume 雖可指「承擔（責任、職務）」（assume office／responsibility），但 assume the problem 不成搭配；它另一義「假定」也與蓋地鐵無關。",D:"✘ project 當動詞是「投射（影像）」或「預估（數字）」（project a 5% growth），不是解決問題。"},
          notes:[{term:"tackle", pos:"v. / n.", gloss:"v. 著手處理（tackle a problem／climate change／crime）；運動上指「攔截鏟球」／n. 攔截、釣具（fishing tackle）。同義：address（address an issue）／deal with／take on／grapple with。", ex:"The city is finally tackling its housing shortage.", exZh:"這座城市終於開始處理住宅短缺的問題。"},{term:"Instead of + V-ing", pos:"句型", gloss:"而不是…（Instead of complaining, he acted.）。注意 instead of 是介系詞片語後接名詞或動名詞；instead 單獨使用則是副詞（He didn't complain; he acted instead.）。"}]},

        { n:26, kind:"名詞",
          stem:"Although the police caught the man who set the fire, his __________ remains a mystery; he neither knew the owners nor gained anything from it.",
          options:{A:"motive 動機",B:"posture 姿勢、體態；姿態立場",C:"justice 正義、司法",D:"feature 特色、特徵"}, answer:"A",
          translation:"雖然警方逮到了縱火的男子，他的動機卻仍是個謎；他既不認識屋主，也沒有從中得到任何好處。",
          explain:{A:"✔ 分號後面正是「為何縱火說不通」的兩個證據：neither knew the owners nor gained anything（不認識屋主也沒獲利），缺的就是犯案的理由，正是 motive。",B:"✘ posture 是「姿勢、體態」（good posture 良好坐姿），不是犯罪原因。",C:"✘ justice 是「正義、司法」（bring sb to justice 使某人受法律制裁）；人已被逮，謎團在原因而非正義。",D:"✘ feature 是「特色」，描述事物的性質，不能解釋行為背後的意圖。"},
          notes:[{term:"motive", pos:"n.", gloss:"動機（a motive for sth／an ulterior motive 別有用心的動機／a motiveless crime 無動機犯罪）。v. motivate 激勵；n. motivation 動機、積極性。注意 motive 偏「犯案或行動的理由」，motivation 偏「內在的驅動力」。", ex:"Detectives still have no clear motive for the killing.", exZh:"警探仍找不出這起兇殺案的明確動機。"},{term:"neither A nor B", pos:"句型", gloss:"既不 A 也不 B（he neither knew… nor gained…）。動詞與最近的主詞一致（Neither he nor his friends were there.）；對照 either A or B。"}]},

        { n:27, kind:"形容詞",
          stem:"So __________ is the disease that the whole class was told to stay home after only two students developed a high fever.",
          options:{A:"strategic 戰略的、策略性的",B:"moral 道德的",C:"inclined 有意願的、傾向於…的",D:"contagious 傳染力強的、會接觸傳染的"}, answer:"D",
          translation:"這種疾病的傳染力之強，以致於只有兩名學生發高燒之後，全班就被要求待在家裡。",
          explain:{D:"✔ So＋adj.＋be 動詞＋主詞＋that… 的倒裝句型，that 子句的結果是「只兩人發燒全班就得停課」，原因必然是傳染力極強，正是 contagious。",A:"✘ strategic 是「戰略的」，修飾決策或位置，不能修飾疾病的傳播力。",B:"✘ moral 是「道德的」，疾病沒有道德屬性。",C:"✘ inclined 是「傾向於」（be inclined to V），主詞須有意願，疾病不會有意願；而且它必須接 to V 才完整。"},
          notes:[{term:"contagious", pos:"adj.", gloss:"接觸傳染的（a highly contagious virus）；也比喻「有感染力的」（contagious enthusiasm／laughter）。n. contagion 傳染。對照 infectious 由病原傳染的（be infected with，第 6 題的誘答）／epidemic 流行病（第 4 題）／immune 免疫的（第 34 題）。", ex:"Measles is one of the most contagious diseases known.", exZh:"麻疹是已知傳染力最強的疾病之一。"},{term:"So + adj. + be + S + that…", pos:"句型", gloss:"倒裝的 so…that 句型：So contagious is the disease that…（＝The disease is so contagious that…）。同型：So great was his fear that he couldn't move.。"}]},

        { n:28, kind:"動詞（過去式）",
          stem:"When I asked my brother where he had hidden the remote, he just __________ his shoulders and pretended he had no idea what I meant.",
          options:{A:"vomited 嘔吐",B:"shrugged 聳（肩）",C:"continued 繼續",D:"injured 使受傷"}, answer:"B",
          translation:"當我問弟弟他把遙控器藏在哪裡時，他只是聳了聳肩，裝作完全不懂我在說什麼。",
          explain:{B:"✔ shrug one's shoulders（聳肩）是固定搭配，正是表達「不知道、不在乎」的肢體動作，與 pretended he had no idea（裝作不知道）完全一致。",A:"✘ vomit 是「嘔吐」，不及物，不能接 his shoulders 當受詞。",C:"✘ continue 是「繼續」，continued his shoulders 語意不通。",D:"✘ injure 是「使受傷」（injure one's knee），雖然文法上可接 shoulders，但語意上弟弟並沒有弄傷自己的肩膀。"},
          notes:[{term:"shrug", pos:"v. / n.", gloss:"聳肩（shrug one's shoulders／give a shrug）；shrug sth off 是「對…不以為意、擺脫」（shrug off criticism／an injury）。", ex:"He shrugged off the criticism and carried on with his plan.", exZh:"他對批評不以為意，繼續執行他的計畫。"},{term:"間接問句語序", pos:"句型", gloss:"I asked him where he had hidden the remote.（不是 where had he hidden）。間接問句一律用陳述句語序，且時態要往後推一格。"}]},

        { n:29, kind:"名詞",
          stem:"According to an old __________ in many Asian countries, sticking your chopsticks straight up in a bowl of rice brings bad luck.",
          options:{A:"superstition 迷信（的說法）",B:"pressure 壓力",C:"nourishment 滋養、養分",D:"artery 動脈"}, answer:"A",
          translation:"在許多亞洲國家，有一種古老的迷信說法：把筷子直插在飯碗裡會招來壞運。",
          explain:{A:"✔ brings bad luck（會招來壞運）是典型的民間禁忌說法，與 an old（古老的）搭配，正是 superstition（迷信）。",B:"✘ pressure 是「壓力」，無法用 According to a pressure 引述某種說法。",C:"✘ nourishment 是「滋養、養分」，屬營養語境，與吉凶禁忌無關。",D:"✘ artery 是「動脈」，人體構造（也可指交通幹道），不能是被引述的說法。"},

        { n:30, kind:"名詞",

          options:{A:"massage 按摩",B:"transmission 傳播；傳送；變速器",C:"prescription 處方（箋）",D:"cough 咳嗽"}, answer:"C",

          explain:{C:"✔ a prescription from your doctor（醫師開的處方）是固定說法，而 the pharmacy will not sell you these strong painkillers（藥局不會賣你強效止痛藥）正是處方藥的管制規定。",A:"✘ massage 是「按摩」，不是購買藥品所需的文件（第 32 題的誘答 massaged 即此字的動詞）。",B:"✘ transmission 是「（疾病）傳播」或「傳送」，不是醫師開立的文件。",D:"✘ cough 是「咳嗽」，是症狀本身；有症狀並不等於取得處方，而且 a cough from your doctor 語意荒謬。"},
          notes:[{term:"prescription", pos:"n.", gloss:"處方箋（write／fill a prescription 開／領處方藥；a prescription drug 處方藥，對照 over-the-counter drug 非處方藥）。v. prescribe 開處方、規定。注意別與 proscribe（禁止）混淆。", ex:"You'll need a prescription to get that medication.", exZh:"你需要處方才能拿到那種藥。"},{term:"painkiller", pos:"n.", gloss:"止痛藥（take painkillers）。相關：pharmacy／drugstore 藥局／pharmacist 藥師／dosage 用藥劑量／side effect 副作用。"}]},

        { n:31, kind:"形容詞",
          stem:"Hurt by the __________ comments people posted about her weight, the actress decided to take a long break from social media.",
          options:{A:"genetic 基因的、遺傳的",B:"muscular 肌肉的、肌肉發達的",C:"nutritious 有營養的",D:"vicious 惡毒的、惡意傷人的"}, answer:"D",
          translation:"這位女演員被網友張貼的惡毒評論所傷，決定長期遠離社群媒體。",

          notes:[{term:"vicious", pos:"adj.", gloss:"惡毒的、凶猛的（a vicious attack／rumor／dog）；a vicious circle／cycle 惡性循環。n. 相關字 vice 惡習、副的（vice president）。同義：malicious 惡意的／spiteful 懷恨的／cruel 殘忍的。", ex:"The campaign turned vicious in its final weeks.", exZh:"選戰在最後幾週變得惡毒起來。"},{term:"過去分詞開頭的分詞構句", pos:"句型", gloss:"Hurt by the comments…, the actress decided…（＝Because she was hurt by the comments…）。p.p. 開頭表被動，主詞必須是承受動作的人。"}]},

        { n:32, kind:"動詞（過去式）",

          options:{A:"stereotyped 對…抱持刻板印象",B:"crippled 使癱瘓、使重創",C:"massaged 按摩",D:"resumed 恢復、重新開始"}, answer:"B",

          notes:[{term:"cripple", pos:"v.", gloss:"使癱瘓、使失去功能（cripple the economy／the power grid／a company）。adj. crippling 造成重創的（crippling debt 沉重債務）。原意是使肢體殘疾，現已避免用於人。", ex:"The strike crippled the country's rail network for a week.", exZh:"這場罷工使該國鐵路網癱瘓了一週。"},{term:"which 引導非限定關係子句", pos:"句型", gloss:"逗號後的 which 指前面「整件事」而非單一名詞：…destroyed most of the boats, which crippled the local economy（這件事使經濟癱瘓）。此時不可用 that。"}]},

        { n:34, kind:"形容詞",

          translation:"就連最富有的家庭也無法不受物價上漲的影響；今年他們當中也有許多人開始到較便宜的超市購物。",

          notes:[{term:"immune", pos:"adj.", gloss:"① 免疫的（be immune to a virus／the immune system 免疫系統）② 不受影響的（No industry is immune to recession.）③ 免除的（be immune from prosecution 享有免訴權）。n. immunity 免疫力、豁免權。注意第 38 題把它放成誘答，兩題正好對照。", ex:"No company is immune to changes in consumer taste.", exZh:"沒有任何公司能不受消費者口味改變的影響。"},{term:"Not even…", pos:"句型", gloss:"就連…也不（Not even the teacher knew the answer.）。語氣強調最極端的例子也不例外，與 even 的強調功能相同但帶否定。"}]},

        { n:35, kind:"名詞",
          stem:"Losing weight without trying and feeling thirsty all the time can be early __________ of diabetes, so they should never be ignored.",

        { n:36, kind:"動詞",

          options:{A:"presume 推定、假定",B:"manipulate 操控、擺布",C:"examine 檢查、審視",D:"qualify 使具備資格"}, answer:"B",
          translation:"這名教派領袖非常清楚如何操控孤單的年輕人：先讓他們感到被愛，再慢慢掌控他們的金錢與人生。",

          translation:"青少年睡得越少，就越容易感冒，因為他們的身體一直沒有時間恢復。",
          explain:{A:"✔ be prone to sth／to V-ing（容易發生…）是固定搭配，空格後正是 to catching colds；原因子句 their bodies never have time to recover（身體沒有時間恢復）說明抵抗力下降，故較易生病。",B:"✘ immune 的搭配雖也是 to（第 34 題考過），但語意是「不受影響、免疫」，睡得越少反而越不容易感冒，邏輯顛倒，是本題最大的陷阱。",C:"✘ severe 是「嚴重的」，修飾病情或處罰（a severe cold／severe punishment），不能說人變得 severe to catching colds。",D:"✘ habitual 是「習慣性的」（a habitual liar），描述反覆的行為，不用於生病的易感性。"},
          notes:[{term:"prone", pos:"adj.", gloss:"易於…的（be prone to injury／errors／flooding；be prone to V-ing）；也可作後位構詞 -prone（accident-prone 容易出事的／error-prone 易出錯的）。對照 be liable to／be susceptible to（易受影響的，語感最接近）／be apt to（傾向於）。", ex:"Low-lying areas are especially prone to flooding.", exZh:"低窪地區特別容易淹水。"},{term:"The + 比較級…, the + 比較級…", pos:"句型", gloss:"越…就越…（The less sleep they get, the more prone they become…）。注意兩個子句都用正常語序，且名詞緊跟比較級（the less sleep, the more time）。"}]},

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const wordOf = q => q.options ? q.options[q.answer] : (q.answerText || '');
const allQ = [];
EXAM.sections.forEach(s => s.groups.forEach(g => g.questions.forEach(q => { q.__sid = s.id; allQ.push(q); })));
const findQ = (n, sid) => allQ.find(q => String(q.n) === String(n) && (sid == null || q.__sid === sid));

document.getElementById('brand').textContent = EXAM.brand;
document.getElementById('examTitle').textContent = EXAM.title;
document.getElementById('examMeta').textContent = EXAM.meta;

let noteCount = 0;
allQ.forEach(q => noteCount += (q.notes || []).length);

const nav = document.getElementById('nav');
EXAM.sections.forEach(s => {
  const a = document.createElement('a');
  a.className = 'chip'; a.href = '#sec-' + s.id; a.textContent = s.label.replace(/^[一二三四五六]、/, m => m);
  nav.appendChild(a);
});
const noteChip = document.createElement('a');
noteChip.className = 'chip'; noteChip.href = '#side'; noteChip.textContent = '重點表 ' + noteCount;
nav.appendChild(noteChip);
const toggleAll = document.createElement('button');
toggleAll.className = 'chip solid'; toggleAll.textContent = '全部展開';
nav.appendChild(toggleAll);

function renderPassage(g, i, sid) {
  let html = esc(g.passage);
  g.questions.forEach(q => {
    if (!q.evidence) return;
    const t = esc(q.evidence);
    if (html.includes(t)) html = html.replace(t, `<span class="hl ev" data-ev="${q.n}">${t}</span>`);
  });
  html = html.replace(/__(\d+)__/g, (m, n) =>
    `<button class="blank" data-blank="${n}" aria-label="第 ${n} 題空格">${n}</button>`);
  const body = '<div class="passage">' +
    html.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, ' ') + '</p>').join('') + '</div>';
  if (!g.zh) return body;
  const id = sid + '-' + i;
  return body +
    `<button class="zhbtn" data-zh="${id}">全文中譯</button>` +
    `<div class="zhbox" id="zh-${id}">` +
      g.zh.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, ' ') + '</p>').join('') +
    '</div>';
}

function renderQ(q) {
  const parts = [];
  if (q.options) {
    const ks = Object.keys(q.options);
    parts.push('<div class="opts">' + ks.map(k =>
      `<div class="opt"><span class="opt-k">(${k})</span><span>${esc(q.options[k])}</span></div>`).join('') + '</div>');
  }
  const head = `<div class="q-tag"><span class="q-n">${String(q.n).padStart(2,'0')}</span><span class="q-kind">${esc(q.kind || '')}</span></div>` +
    (q.prompt ? `<p class="prompt">${esc(q.prompt)}</p>` : '') +
    (q.stem ? `<p class="stem">${esc(q.stem).replace(/\n/g,'<br>')}</p>` : '');

  let ans = '';
  if (q.answers) {
    ans = '<ul class="fills">' + q.answers.map(a =>
      `<li class="fill"><span class="fill-k">${esc(a.k)}</span><span class="fill-w hl" data-ansmulti>${esc(a.w)}</span><span class="fill-n">${esc(a.note || '')}</span></li>`).join('') + '</ul>';
  } else {
    const label = q.options ? `(${q.answer}) ${esc(wordOf(q))}` :
      (q.answer ? `(${q.answer}) ${esc(q.answerText)}` : esc(q.answerText));
    ans = `<p class="ans"><span class="ans-k">答案</span><span class="ans-v hl" data-ans="${q.n}">${label}</span></p>`;
  }

  let expl = '';
  if (q.explain) {
    expl = '<ul class="lines">' + Object.keys(q.options).map(k => {
      const right = q.multi ? q.multi.includes(k) : k === q.answer;
      return `<li class="line ${right ? 'right' : 'wrong'}"><span class="line-k">(${k})</span><span>${esc(q.explain[k] || '')}</span></li>`;
    }).join('') + '</ul>';
  }
  const why = q.why ? `<p class="why">${esc(q.why)}</p>` : '';
  const sample = q.sample ? `<div class="sample"><p class="note-h">參考範文</p>` +
    q.sample.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g,' ')}</p>`).join('') + '</div>' : '';
  const evid = q.evidence ? `<p class="evid"><span>文中依據</span>${esc(q.evidence)}</p>` : '';
  const notes = (q.notes || []).length ? `<div class="note"><p class="note-h">重點整理</p>` +
    q.notes.map(nt => `<p class="note-i"><span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span><span class="gloss">${esc(nt.gloss || '')}</span>` +
      (nt.ex ? `<span class="ex">${esc(nt.ex)}<i>${esc(nt.exZh || '')}</i></span>` : '') + '</p>').join('') + '</div>' : '';

  return `<article class="q" id="q-${q.__sid}-${q.n}" data-n="${q.n}" data-sid="${q.__sid}">
    <div class="q-top">${head}${parts.join('')}
      <button class="reveal" aria-expanded="false" aria-controls="body-${q.n}">看詳解</button>
    </div>
    <div class="body" id="body-${q.n}">
      ${ans}${q.translation ? `<p class="zh">${esc(q.translation)}</p>` : ''}${expl}${why}${evid}${sample}${notes}
    </div>
  </article>`;
}

document.getElementById('main').innerHTML = EXAM.sections.map((s, i) => `
  <section class="sec" id="sec-${s.id}">
    <div class="sec-head">
      <span class="sec-num">${String(i+1).padStart(2,'0')}</span>
      <h2 class="sec-label">${esc(s.label)}</h2>
      <span class="sec-score">${esc(s.score || '')}</span>
    </div>
    ${s.instruction ? `<p class="sec-inst">${esc(s.instruction)}</p>` : ''}
    ${s.bank ? `<div class="bank${s.bankWide ? ' wide' : ''}">${Object.keys(s.bank).map(k =>
      `<div class="bank-i" data-bank="${k}"><span>(${k})</span>${esc(s.bank[k])}</div>`).join('')}</div>` : ''}
    ${s.groups.map((g, gi) => (g.passage ? renderPassage(g, gi, s.id) : '') + g.questions.map(renderQ).join('')).join('')}
  </section>`).join('');

const items = [];
allQ.forEach(q => (q.notes || []).forEach(nt => items.push({ ...nt, n: q.n, sid: q.__sid })));
document.getElementById('side').innerHTML = `
  <p class="side-h">Notes</p>
  <p class="side-t">本卷重點 ${items.length} 則</p>
  <ul class="card-list">${items.map(nt => `
    <li class="card-item"><a href="#q-${nt.sid}-${nt.n}">
      <span class="jump">第 ${nt.n} 題</span>
      <span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span>
      <div class="gloss">${esc(nt.gloss || '')}</div>
    </a></li>`).join('')}</ul>
  <p class="side-note">點任一則可跳到出處題目。用瀏覽器列印（Ctrl／⌘ + P）會自動展開全部詳解與中譯，可直接印成講義。</p>`;

document.getElementById('foot').textContent = `共 ${allQ.length} 題 · ${EXAM.footer}`;

function setOpen(card, open) {
  card.classList.toggle('open', open);
  const btn = card.querySelector('.reveal');
  btn.setAttribute('aria-expanded', open);
  btn.firstChild.nodeValue = open ? '收合詳解' : '看詳解';
  const n = card.dataset.n;
  const sec = card.closest('.sec') || document;
  card.querySelectorAll('.hl').forEach(h => h.classList.toggle('on', open));
  const ev = sec.querySelector(`[data-ev="${n}"]`);
  if (ev) ev.classList.toggle('on', open);
  const q = findQ(n, card.dataset.sid);
  if (q && q.answer && q.answerText) {
    const bi = sec.querySelector(`[data-bank="${q.answer}"]`);
    if (bi) bi.classList.toggle('used', open);
  }
  const bl = sec.querySelector(`[data-blank="${n}"]`);
  if (bl) {
    if (open) {
      bl.classList.add('filled');
      bl.innerHTML = `<sup>${n}</sup><span class="hl">${esc(wordOf(q))}</span>`;
      requestAnimationFrame(() => bl.querySelector('.hl').classList.add('on'));
    } else {
      bl.classList.remove('filled');
      bl.textContent = n;
    }
  }
}
document.addEventListener('click', e => {
  const rv = e.target.closest('.reveal');
  if (rv) { const c = rv.closest('.q'); setOpen(c, !c.classList.contains('open')); return; }
  const zb = e.target.closest('.zhbtn');
  if (zb) { zb.classList.toggle('on'); document.getElementById('zh-' + zb.dataset.zh).classList.toggle('on'); return; }
  const bl = e.target.closest('.blank');
  if (bl) {
    const c = document.getElementById('q-' + bl.dataset.blank);
    if (!c.classList.contains('open')) setOpen(c, true);
    c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});
toggleAll.addEventListener('click', () => {
  const open = toggleAll.textContent === '全部展開';
  document.querySelectorAll('.q').forEach(c => setOpen(c, open));
  toggleAll.textContent = open ? '全部收合' : '全部展開';
});
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.q').forEach(c => setOpen(c, true));
  document.querySelectorAll('.zhbox').forEach(b => b.classList.add('on'));
  toggleAll.textContent = '全部收合';
});
</script>
</body>
</html>
