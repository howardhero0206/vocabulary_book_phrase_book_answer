<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>單字書小考 詳解｜10-2~11 (310)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EBEE; --card:#FDFDFC;
  --ink:#10202F; --ink-2:#56687A; --ink-3:#7C8B99;
  --rule:#C6D0D8; --pen:#17457E; --hl:#FFE773; --miss:#A34234;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  --read:'Literata',Georgia,'Times New Roman',serif;
  --han:'PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  --maxw:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--han);font-size:16px;line-height:1.75}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px;border-radius:2px}

.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:14px 24px 0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.title{font-size:23px;font-weight:600;margin:0;line-height:1.3}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin:4px 0 0;letter-spacing:.04em}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px 0 11px;margin-top:10px;border-top:1px solid var(--rule)}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.04em;border:1px solid var(--rule);background:transparent;color:var(--ink-2);padding:5px 10px;border-radius:999px;cursor:pointer;text-decoration:none;transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--pen);color:var(--pen)}
.chip.solid{margin-left:auto;border-color:var(--ink);color:var(--ink);font-weight:500}
.chip.solid:hover{background:var(--ink);color:var(--card)}

.wrap{max-width:var(--maxw);margin:0 auto;padding:28px 24px 96px;display:grid;gap:36px;grid-template-columns:minmax(0,1fr) 288px}
@media (max-width:1020px){.wrap{grid-template-columns:minmax(0,1fr);gap:44px}}

.sec{margin:0 0 48px;scroll-margin-top:136px}
.sec-head{display:flex;align-items:baseline;gap:12px;padding-bottom:9px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.sec-num{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--ink-3)}
.sec-label{font-size:18px;font-weight:600;margin:0}
.sec-score{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:auto}
.sec-inst{font-size:13.5px;color:var(--ink-2);margin:9px 0 0}

.bank{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:16px 0 0}
@media (max-width:760px){.bank{grid-template-columns:repeat(2,1fr)}}
.bank-i{background:var(--card);padding:8px 10px;font-family:var(--read);font-size:14.5px}
.bank-i span{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-right:5px}
.bank-i.used{background:#F2F5F6;color:var(--ink-3)}

.passage{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--ink);padding:22px 26px;margin:18px 0 0;font-family:var(--read);font-size:16.5px;line-height:1.95;color:#1a2836}
.passage p{margin:0 0 1em}
.passage p:last-child{margin-bottom:0}
.blank{display:inline-block;min-width:70px;text-align:center;border:0;border-bottom:1.5px solid var(--ink);font-family:var(--mono);font-size:13px;color:var(--pen);cursor:pointer;background:none;padding:0 4px;line-height:1.4}
.blank:hover{background:rgba(23,69,126,.07)}
.blank.filled{font-family:var(--read);font-size:16.5px;color:var(--ink);border-bottom-color:transparent;min-width:0}
.blank sup{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-right:2px}
.zhbtn{display:block;margin:0 0 18px;background:var(--card);border:1px solid var(--rule);border-top:0;width:100%;text-align:left;padding:8px 26px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--pen);cursor:pointer}
.zhbtn:hover{color:var(--ink)}
.zhbtn::after{content:' ▾'}
.zhbtn.on::after{content:' ▴'}
.zhbox{display:none;background:#F7F9FA;border:1px solid var(--rule);border-top:0;padding:18px 26px;margin:0 0 18px;font-size:15px;line-height:1.95;color:#22323F}
.zhbox.on{display:block}
.zhbox p{margin:0 0 .9em}
.zhbox p:last-child{margin:0}

.q{background:var(--card);border:1px solid var(--rule);margin:14px 0 0;scroll-margin-top:142px}
.q-top{padding:16px 22px 14px}
.q-tag{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.q-n{font-family:var(--mono);font-size:13px;font-weight:600}
.q-kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.prompt{font-size:14.5px;line-height:1.85;color:var(--ink-2);margin:0 0 11px;padding-left:11px;border-left:2px solid var(--rule)}
.stem{font-family:var(--read);font-size:16.5px;line-height:1.85;margin:0 0 13px;color:#1a2836}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:9px;font-family:var(--read);font-size:15.5px;line-height:1.6;padding:3px 0;color:#243342}
.opt-k{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding-top:2px;flex:none}
.reveal{display:block;width:100%;text-align:left;margin-top:14px;background:none;border:0;border-top:1px dashed var(--rule);padding:11px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--pen);cursor:pointer}
.reveal:hover{color:var(--ink)}
.reveal::after{content:' ▾'}
.q.open .reveal::after{content:' ▴'}
.q.open .reveal{color:var(--ink-3)}

.body{display:none;border-top:1px solid var(--rule);background:#F7F9FA;padding:18px 22px 20px}
.q.open .body{display:block}
.ans{display:flex;align-items:baseline;gap:10px;margin:0 0 13px;flex-wrap:wrap}
.ans-k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink-3);flex:none;padding-top:2px}
.ans-v{font-family:var(--read);font-size:18px;font-weight:600}
.fills{list-style:none;margin:0 0 13px;padding:0}
.fill{display:flex;gap:11px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--rule)}
.fill-k{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none;width:26px}
.fill-w{font-family:var(--read);font-size:17px;font-weight:600;flex:none}
.fill-n{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.zh{font-size:15px;line-height:1.85;margin:0 0 14px;color:#22323F}
.why{font-size:14.5px;line-height:1.85;margin:0 0 4px;color:#22323F;border-top:1px solid var(--rule);padding-top:12px}
.lines{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.line{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.line-k{font-family:var(--mono);font-size:12.5px;flex:none;width:28px;color:var(--ink-3);padding-top:2px}
.line.right{color:var(--ink)}
.line.right .line-k{color:var(--ink);font-weight:600}
.line.right .line-k::after{content:'✓';display:block;font-size:12px;line-height:1.3}
.line.wrong .line-k{color:var(--miss);opacity:.85}
.line.wrong .line-k::after{content:'✗';display:block;font-size:12px;line-height:1.3}
.evid{margin:15px 0 0;font-family:var(--read);font-size:14.5px;line-height:1.8;color:var(--ink-2);padding-left:13px;border-left:2px solid var(--hl)}
.evid span{font-family:var(--han);font-size:11px;letter-spacing:.14em;color:var(--ink-3);display:block;margin-bottom:3px}

.hl{background-image:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 90%,transparent 90%);background-repeat:no-repeat;background-size:0% 100%;transition:background-size .55s cubic-bezier(.2,.75,.3,1);border-radius:1px}
.hl.on{background-size:100% 100%}

.sample{margin:15px 0 0;border:1px solid var(--rule);border-left:3px solid var(--ink);background:var(--card);padding:16px 20px}
.sample p:not(.note-h){font-family:var(--read);font-size:15.5px;line-height:1.9;color:#1a2836;margin:0 0 1em}
.sample p:last-child{margin-bottom:0}
.bank.wide{grid-template-columns:1fr}
.bank.wide .bank-i{font-size:15px;line-height:1.7;padding:10px 14px}
.note{margin:15px 0 0;border:1px solid var(--rule);background:var(--card);padding:13px 16px}
.note-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.note-i{margin:0;padding:9px 0 0;border-top:1px dotted var(--rule)}
.note-i:first-of-type{border-top:0;padding-top:0}
.term{font-family:var(--read);font-size:16px;font-weight:600}
.pos{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin:0 6px}
.gloss{font-size:14.5px}
.ex{font-family:var(--read);font-size:14px;color:var(--ink-2);line-height:1.7;margin:3px 0 0;display:block}
.ex i{font-family:var(--han);font-style:normal;font-size:13px;color:var(--ink-3);display:block}

.side{position:sticky;top:136px;align-self:start;max-height:calc(100vh - 164px);overflow:auto;padding-right:4px}
@media (max-width:1020px){.side{position:static;max-height:none;scroll-margin-top:136px}}
.side-h{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0 0 3px}
.side-t{font-size:16px;font-weight:600;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.card-list{margin:0;padding:0;list-style:none}
.card-item{border-bottom:1px solid var(--rule);padding:11px 0}
.card-item a{display:block;text-decoration:none;color:inherit}
.card-item a:hover .term{background:var(--hl)}
.jump{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);float:right;padding-top:5px}
.side-note{font-size:12.5px;color:var(--ink-3);line-height:1.7;margin:16px 0 0}
.foot{max-width:var(--maxw);margin:0 auto;padding:0 24px 48px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  body{background:#fff;font-size:10.5pt}
  .top,.side,.reveal,.foot,.zhbtn{display:none!important}
  .wrap{display:block;max-width:none;padding:0}
  .q .body{display:block!important}
  .zhbox{display:block!important}
  .q{break-inside:avoid;border-color:#999;margin-bottom:9pt}
  .passage{break-inside:avoid}
  .hl{background-size:100% 100%!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <p class="eyebrow" id="brand"></p>
    <h1 class="title" id="examTitle"></h1>
    <p class="meta" id="examMeta"></p>
    <nav class="bar" id="nav"></nav>
  </div>
</header>

<div class="wrap"><main id="main"></main><aside class="side" id="side"></aside></div>
<p class="foot" id="foot"></p>

<script>
/* ==========================================================================
   ①  題目與詳解全部寫在下面的 EXAM 物件裡。要改題、加題、修字，只動這裡。

   section（大題）：{ id, label, score, instruction, bank?, groups: [...] }
   group（同一篇文章的題組）：{ passage?, zh?, questions: [...] }
       passage 裡寫 __7__ 就會變成可點的空格，數字對應題號。
       zh 是全文中譯，會做成可展開的按鈕。

   question 依題型三選一：
     選擇題   { n, kind, stem, options:{A..D}, answer:"B", translation, explain:{A..D}, evidence?, notes? }
     單一填答 { n, kind, stem, answerText:"prejudice", why, notes? }
     多格填答 { n, kind, prompt, stem, answers:[{k:"①", w:"字", note:"說明"}], notes? }
   ========================================================================== */
const EXAM = {
  brand: "單字書小考 (310)",
  title: "單字書小考 詳解｜10-2~11",
  meta: "Instructor: Howard Chang　·　範圍：單字書10-2~11 (Class 310)",
  footer: "KGHS 英文字彙字識+ Level 5【10-2~11】單字小考 (Class 310)",
  sections: [
  {
    id:"mc", label:"Multiple Choice", score:"第 1-40 題（80%，每題 2%）",
    groups:[{
      questions:[
        { n:1, kind:"形容詞",
          stem:"Despite repeated warnings that the cliff path was deadly, only __________ climbers ventured up it during the typhoon; even veteran guides considered it out of the question.",
          options:{A:"experienced 有經驗的、老練的",B:"insane 瘋狂的、失去理智的",C:"rational 理性的",D:"wary 警惕的、提防的"}, answer:"B",
          translation:"儘管一再有人警告那條崖邊步道極為危險，颱風期間仍有少數瘋狂的登山者冒險上去；就連資深嚮導都認為那根本不可能。",
          explain:{B:"✔ 三個線索疊在一起：warnings that the cliff path was deadly（警告說步道致命）、during the typhoon（颱風期間）、even veteran guides considered it out of the question（連資深嚮導都認為不可能）。會在這種條件下上山的人只能是「瘋了」，正是 insane。",A:"✘ experienced 是「老練的」，但句尾明說 even veteran guides（連資深嚮導）都認為行不通，老練的人正是不會去的那群人，邏輯被句子自己否定掉了。",C:"✘ rational 是「理性的」，理性的人不會在颱風天走致命步道，語意完全相反。",D:"✘ wary 是「警惕的」，警惕的人會避開風險，同樣與「冒險上去」矛盾。"},
          notes:[{term:"insane", pos:"adj.", gloss:"瘋狂的、荒謬的（an insane idea／be driven insane／insanely expensive 貴得離譜）。n. insanity 精神失常；反義 sane 理智的。", ex:"Driving in this storm would be insane.", exZh:"在這種暴風雨中開車簡直是瘋了。"},{term:"out of the question", pos:"片語", gloss:"根本不可能、免談（A refund is out of the question.）。注意與 out of question（無疑）以及 beside the point（不相干）區別。", ex:"Quitting now is out of the question.", exZh:"現在放棄是絕對不可能的。"},{term:"venture", pos:"v. / n.", gloss:"v. 冒險前往、大膽提出（venture up a path／venture an opinion）／n. 事業（a joint venture 合資企業）。adj. venturesome 大膽的。"}]},

        { n:2, kind:"名詞",
          stem:"Under a new municipal __________, households that switch to sustainable energy are eligible for a subsidy covering half the cost of installing solar panels.",
          options:{A:"perspective 觀點、視角",B:"motive 動機",C:"notion 概念、想法",D:"scheme 方案、計畫（制度）"}, answer:"D",
          translation:"依據市政府新推出的方案，改用永續能源的家庭可以申請補助，金額涵蓋安裝太陽能板費用的一半。",
          explain:{D:"✔ Under a new municipal…（依據市政府新的…）加上後面具體的補助規定（eligible for a subsidy），指的是一套可依循的制度，正是 scheme 的「方案、計畫」之義；a subsidy scheme 是標準搭配。",A:"✘ perspective 是「觀點」，是看事情的角度，不能用 Under a perspective 引出補助資格。",B:"✘ motive 是「動機」，是行為背後的理由，不是可供申請的制度。",C:"✘ notion 是「概念、想法」，停留在腦中的念頭，沒有申請資格這種執行細節。"},
          notes:[{term:"scheme 的兩個語氣", pos:"辨析", gloss:"① 中性的「方案、制度」（a subsidy／pension／recycling scheme，英式常用）② 帶不法意味的「計謀」（a get-rich-quick scheme）。另一份 10-2~11 小考第 11 題考的是後者（銀行行員的偷錢計謀），本題考的是前者，判斷靠語境是否涉及不法。", ex:"The city launched a scheme to subsidize rooftop solar panels.", exZh:"市府推出了補助屋頂太陽能板的方案。"},{term:"be eligible for", pos:"片語", gloss:"符合資格、有權獲得（be eligible for a subsidy／a scholarship；be eligible to V）。n. eligibility 資格。反義 ineligible。"},{term:"municipal", pos:"adj.", gloss:"市政的、地方自治的（municipal government／elections／waste）。n. municipality 直轄市、自治市。"}]},

        { n:3, kind:"動詞（過去式）",
          stem:"After a brief recess to repair the faulty microphones, the judge __________ the session, and the witness continued to testify exactly where she had stopped.",
          options:{A:"resumed 恢復、繼續進行",B:"presumed 推定、假定",C:"justified 使…正當化",D:"subjected 使遭受（subject sb to sth）"}, answer:"A",
          translation:"短暫休庭修好故障的麥克風之後，法官讓庭訊繼續進行，證人就從她剛好停下來的地方接著作證。",
          explain:{A:"✔ After a brief recess（短暫休庭之後）加上 the witness continued to testify exactly where she had stopped（證人從停下的地方接著講），正是「中斷後再接續」，resume the session 是固定搭配。",B:"✘ presume 是「推定」（presume sb innocent），受詞是命題或身分，不能接 the session。",C:"✘ justify 是「使正當化」，受詞是行為或決定；法官不是在為庭訊找理由。",D:"✘ subject 的搭配是 subject sb to sth（使某人遭受），介系詞不可省略，而且語意與休庭後復庭無關。"},
          notes:[{term:"resume", pos:"v.", gloss:"恢復、繼續（resume the session／talks／one's seat 回到座位；Play resumed after the rain.）。n. resumption 恢復。注意名詞 résumé（履歷）是同拼不同字。", ex:"Negotiations will resume on Monday morning.", exZh:"談判將於週一上午恢復。"},{term:"recess", pos:"n.", gloss:"休會、休庭、（美式）下課休息時間（the court is in recess／a brief recess）。相關：adjourn 休庭、延會／session 會期、庭期。"},{term:"testify", pos:"v.", gloss:"作證（testify against／for sb；testify that…）。n. testimony 證詞。相關：witness 證人／under oath 在宣誓下。"}]},

        { n:4, kind:"名詞",
          stem:"Scientists believe the microbes in our __________ have a profound effect not only on how we absorb nutrients but also on our overall mood.",
          options:{A:"thigh 大腿",B:"spine 脊椎",C:"gut 腸道、消化道",D:"artery 動脈"}, answer:"C",
          translation:"科學家認為我們腸道裡的微生物不僅深刻影響我們吸收營養的方式，也影響我們整體的情緒。",
          explain:{C:"✔ 兩個線索都指向消化系統：microbes（微生物，即腸道菌群）與 how we absorb nutrients（我們如何吸收營養），正是 gut（腸道）；近年熱門的 gut-brain axis（腸腦軸）也正好解釋了為何會影響 mood。",A:"✘ thigh 是「大腿」，肌肉組織，不是微生物群聚與吸收營養的地方。",B:"✘ spine 是「脊椎」，骨骼結構，與營養吸收無關。",D:"✘ artery 是「動脈」，負責輸送血液而非吸收養分，而且動脈內不應有微生物（若有即是嚴重感染）。"},
          notes:[{term:"gut", pos:"n.", gloss:"① 腸道、消化道（gut health／gut bacteria／the gut microbiome 腸道菌群）② 直覺（a gut feeling／trust your gut）③ guts 膽量（另一份 10-2~11 小考第 16 題考的就是這個複數義）。", ex:"Researchers are studying how gut bacteria influence depression.", exZh:"研究人員正在探討腸道細菌如何影響憂鬱症。"},{term:"microbe", pos:"n.", gloss:"微生物（microbes in the soil）。adj. microbial；n. microbiome 微生物群系。相關：bacteria 細菌／virus 病毒／probiotic 益生菌。"},{term:"profound", pos:"adj.", gloss:"深刻的、深遠的（a profound effect／impact／change；profound silence 一片沉寂）。adv. profoundly；n. profundity。"}]},

        { n:5, kind:"形容詞",
          stem:"Having seen through the polished rhetoric of politicians on every continent, the __________ diplomat was seldom deceived by flattery or propaganda.",
          options:{A:"innocent 天真無邪的、無辜的",B:"careless 粗心的",C:"sophisticated 老練世故的；精密複雜的",D:"naive 天真的、容易輕信的"}, answer:"C",
          translation:"這位老練世故的外交官看透了各大洲政治人物那些精緻的話術，很少被奉承或宣傳所騙。",
          explain:{C:"✔ Having seen through the polished rhetoric…on every continent（看透各大洲的精緻話術）加上 was seldom deceived（很少被騙），描述的是閱歷豐富、不易受騙，正是 sophisticated 的「老練世故」之義。",A:"✘ innocent 是「天真無邪」，天真的人正是容易被話術騙的那種，與 seldom deceived 矛盾。",B:"✘ careless 是「粗心」，粗心的人更容易上當，同樣與句意相反。",D:"✘ naive 是「容易輕信」，與 seldom deceived 直接衝突，是本題最明顯的反向陷阱。"},
          notes:[{term:"sophisticated 的兩個語意", pos:"辨析", gloss:"① （人）老練世故、不易受騙、有品味（a sophisticated diplomat／audience）② （技術）精密複雜的（sophisticated equipment）。另一份 10-2~11 小考第 19 題考的是後者（汽車電腦系統），本題考的是前者。n. sophistication。", ex:"Audiences today are far more sophisticated about special effects.", exZh:"如今的觀眾對特效的鑑別力高多了。"},{term:"see through", pos:"片語動詞", gloss:"看穿、看透（see through a lie／sb's excuses）；另有「堅持到最後」之義（see it through）。"},{term:"rhetoric", pos:"n.", gloss:"修辭、（空洞的）言辭（empty／political rhetoric；the art of rhetoric 修辭學）。adj. rhetorical（a rhetorical question 反問句）。相關：flattery 奉承／propaganda 宣傳。"}]},

        { n:6, kind:"過去分詞（被動）",
          stem:"Although retirees are often __________ as hopeless with technology, many demonstrate a competence with new apps that their grandchildren find genuinely striking.",
          options:{A:"stereotyped 被貼上刻板印象的標籤",B:"diagnosed 被診斷（出疾病）",C:"controlled 被控制",D:"injured 被弄傷"}, answer:"A",
          translation:"雖然退休族常被貼上「對科技一竅不通」的刻板標籤，許多人在使用新應用程式上展現的熟練程度，卻讓他們的孫子輩真心驚訝。",
          explain:{A:"✔ 空格後是 as hopeless with technology（被當成對科技沒救），需要一個能搭配 as＋補語的被動動詞；be stereotyped as sth（被刻板地認定為）正是如此，而 Although（雖然）後接的反例也印證這是不實的以偏概全。",B:"✘ diagnose 的搭配是 diagnose sb with sth（第 2 份小考考過），受詞後接 with 而非 as，而且「對科技不熟」不是疾病。",C:"✘ control 是「控制」，後面不接 as 補語，語意上也不是被控制。",D:"✘ injure 是「弄傷」，接 as 不成結構，語意更無關。"},
          notes:[{term:"be stereotyped as", pos:"片語", gloss:"被刻板地認定為（be stereotyped as lazy／as a troublemaker）。n. stereotype 刻板印象（challenge／break a stereotype）；另一份 10-2~11 小考第 17 題考的是名詞用法。", ex:"Teenagers are often stereotyped as self-absorbed.", exZh:"青少年常被貼上只顧自己的刻板標籤。"},{term:"competence", pos:"n.", gloss:"能力、勝任（demonstrate competence／technical competence）。adj. competent 有能力的、夠格的；反義 incompetent。"},{term:"hopeless", pos:"adj.", gloss:"沒救的、不擅長的（be hopeless at math／with computers）；也指「絕望的」（a hopeless situation）。注意「不擅長」用 at 或 with。"}]},

        { n:7, kind:"名詞",
          stem:"After eleven straight defeats, the team's __________ had diminished so badly that even the most devoted players began skipping practice, and the locker room felt gloomy.",
          options:{A:"insight 洞察、深刻見解",B:"tension 緊張、張力",C:"originality 原創性",D:"morale 士氣"}, answer:"D",
          translation:"在連續十一場敗仗之後，球隊的士氣低落到連最投入的球員都開始不去練習，休息室裡瀰漫著低迷的氣氛。",
          explain:{D:"✔ eleven straight defeats（連敗十一場）、players began skipping practice（球員開始不練球）、the locker room felt gloomy（休息室氣氛低迷）三個線索都指向群體鬥志，正是 morale（士氣）。",A:"✘ insight 是「洞察、深刻見解」，是理解力而非鬥志，也不會因連敗而 diminish 到讓人翹練習。",B:"✘ tension 是「緊張」；連敗通常是讓緊張升高而非 diminished（降低），方向不對。",C:"✘ originality 是「原創性」，是創意的特質，與球隊的鬥志無關。"},
          notes:[{term:"morale", pos:"n.", gloss:"士氣（讀 /məˈræl/，重音在後；boost／raise／damage morale；morale is low／high）。注意與 moral（道德的）、morality（道德）拼法相近但讀音與字義都不同——另一份小考第 11 題就把 morality 放在誘答。", ex:"A win like that does wonders for team morale.", exZh:"這樣的一場勝利對球隊士氣有奇效。"},{term:"diminish", pos:"v.", gloss:"減少、降低（Morale diminished.／diminish sb's authority）。n. 相關片語 the law of diminishing returns 報酬遞減法則。"},{term:"straight", pos:"adj.", gloss:"此處是「連續的」（eleven straight defeats／three straight wins）。同義：consecutive／in a row／running。"}]},

        { n:8, kind:"形容詞",
          stem:"After swallowing a toxic cleaning liquid by mistake, the toddler was rushed to the hospital with __________ stomach pain that grew unbearable within minutes.",
          options:{A:"chronic 慢性的、長期不癒的",B:"acute 急性的；劇烈的",C:"habitual 習慣性的",D:"sane 精神正常的、理智的"}, answer:"B",
          translation:"幼童誤喝了有毒的清潔液之後，被緊急送醫，腹痛來得又急又猛，幾分鐘內就痛到難以忍受。",
          explain:{B:"✔ 兩個時間線索決定答案：by mistake 剛喝下、以及 grew unbearable within minutes（幾分鐘內就痛到受不了）。發作極快又極劇烈，正是 acute（急性、劇烈）。",A:"✘ chronic 是「慢性的」，指病程長達數月數年，與「幾分鐘內」直接衝突；本卷第 19 題才是 chronic 的題目，兩題剛好把這組反義字拆開考。",C:"✘ habitual 是「習慣性的」（a habitual offender），描述反覆出現的行為模式，誤食中毒是單一突發事件。",D:"✘ sane 是「精神正常的」，修飾人而非疼痛。"},
          notes:[{term:"acute / chronic", pos:"辨析", gloss:"acute 急性的、劇烈的（acute pain／acute appendicitis／an acute shortage）／chronic 慢性的、長期的（chronic pain／illness）。acute 另有「敏銳的」之義（an acute sense of smell／acute hearing）。本卷第 8、19 題正好是這一組的正反面。", ex:"She was admitted with acute abdominal pain.", exZh:"她因急性腹痛住院。"},{term:"toddler", pos:"n.", gloss:"學步的幼童（約一到三歲）。年齡序列：infant 嬰兒／toddler 幼童／preschooler 學前兒童／adolescent 青少年。"},{term:"unbearable", pos:"adj.", gloss:"難以忍受的（unbearable pain／heat）。v. bear 忍受（can't bear sth）；adv. unbearably。"}]},

        { n:9, kind:"名詞",
          stem:"Unable to articulate an excuse for his conduct during the exam, Ben gave only a __________ so quiet that no one could make out a single word.",
          options:{A:"mumble 含糊不清的低語",B:"shrug 聳肩（的動作）",C:"posture 姿勢、體態",D:"justice 正義、司法"}, answer:"A",
          translation:"Ben 說不出自己考試時行為的理由，只含糊低聲咕噸了一句，聲音小到沒人聽得出一個字。",
          explain:{A:"✔ 關鍵是 so quiet that no one could make out a single word（小到聽不出一個字）：既然涉及「聽得出字」，空格必須是出聲的東西，而 mumble 當名詞正是「含糊不清的低語」。",B:"✘ shrug 是「聳肩」，是無聲的肢體動作，不可能被形容成 quiet 或讓人去「聽出字」，這是本題最需要留意的陷阱。",C:"✘ posture 是「姿勢、體態」，同樣無聲，也不會有字可辨。",D:"✘ justice 是「正義、司法」，抽象概念，無法被 give 出來當回應。"},
          notes:[{term:"mumble", pos:"v. / n.", gloss:"含糊地說、咕噸（mumble an apology／Don't mumble!）／n. 含糊的低語。同義：mutter 低聲抱怨（偏不滿）／murmur 低聲細語（偏柔和）／mug up 無關。", ex:"He mumbled something about being late and hurried off.", exZh:"他含糊說了句遲到之類的話就匆匆走了。"},{term:"make out", pos:"片語動詞", gloss:"辨認出（看或聽）（make out a word／a figure in the dark／I can't make out his handwriting.）。相關：discern 辨識出／decipher 破解。"},{term:"articulate", pos:"v. / adj.", gloss:"v. 清楚說出（articulate one's thoughts）／adj. 表達清楚的（an articulate speaker）。n. articulation 發音、清楚表達。"}]},

        { n:10, kind:"動詞",
          stem:"During the final rehearsal, the puppeteer could __________ eight strings at once, coordinating such subtle movements that the wooden dancer seemed truly alive.",
          options:{A:"strain 拉傷；使緊繃",B:"examine 檢查、審視",C:"manipulate 靈巧操作；操控",D:"justify 使…正當化"}, answer:"C",
          translation:"在最後一次排練時，這位操偶師能同時操控八條絲線，協調出細微的動作，讓那個木製舞者看起來真像活的一樣。",
          explain:{C:"✔ puppeteer（操偶師）同時控制 eight strings（八條線）並 coordinating such subtle movements（協調細微動作），正是 manipulate 的本義「用手靈巧地操作」。",A:"✘ strain 是「拉傷、使緊繃」，受詞是肌肉或關係（strain a muscle／strain relations），操偶師不是在把線拉傷。",B:"✘ examine 是「檢查」，是觀察評估的動作，無法產生讓木偶活起來的動態效果。",D:"✘ justify 是「使正當化」，受詞是行為或主張，接不上 eight strings。"},
          notes:[{term:"manipulate 的兩個語意", pos:"辨析", gloss:"① 靈巧地操作（manipulate the controls／strings／data 處理資料）② （負面）操控人（manipulate public opinion／emotionally manipulate sb）。另一份 10-2~11 小考第 36 題考的是後者（教派領袖操控年輕人），本題考的是前者。adj. manipulative 善於操控人的。", ex:"Surgeons manipulate the instruments through a tiny incision.", exZh:"外科醫師透過一個極小的切口操作器械。"},{term:"coordinate", pos:"v.", gloss:"協調、使配合（coordinate movements／efforts／a response）。n. coordination 協調性（hand-eye coordination 手眼協調）；n. coordinator 協調者。"},{term:"subtle", pos:"adj.", gloss:"細微的、不易察覺的（讀 /ˈsʌtl/，b 不發音）（a subtle difference／change／hint）。n. subtlety。"}]},

        { n:11, kind:"名詞",
          stem:"Every family has a __________ in the closet; ours is Great-Uncle Ray, whose theft of company funds was concealed for decades until a reporter uncovered it.",
          options:{A:"tumor 腫瘤",B:"skeleton 骨骸、骷髏",C:"bruise 瘀青",D:"plot 情節；陰謀；一小塊地"}, answer:"B",
          translation:"每個家庭都有不可告人的家醜；我們家的是雷叔公，他挪用公司資金的事被隱瞞了數十年，直到一名記者揭發出來。",
          explain:{B:"✔ a skeleton in the closet（櫃子裡的骷髏）是固定成語，指「不願外揚的家醜或秘密」；分號後面舉的例子正是被隱瞞數十年的挪用公款醜聞，與成語完全對應。",A:"✘ tumor 是「腫瘤」，沒有這個成語，而且醜聞不是疾病。",C:"✘ bruise 是「瘀青」，是外傷痕跡，與家族秘密無關。",D:"✘ plot 是「情節、陰謀」，雖與「隱瞞」沾得上一點邊，但 a plot in the closet 不是固定說法，而且叔公的行為是既成事實而非策畫中的陰謀。"},
          notes:[{term:"a skeleton in the closet", pos:"片語", gloss:"不可告人的秘密、家醜（英式作 a skeleton in the cupboard）。相關：wash one's dirty linen in public 家醜外揚／cover up 掩蓋／come to light 曝光。", ex:"Every political family has a few skeletons in the closet.", exZh:"每個政治家族都有幾樁不可告人的秘密。"},{term:"conceal", pos:"v.", gloss:"隱瞞、藏起（conceal the truth／a weapon；conceal sth from sb）。n. concealment。反義 reveal／disclose／uncover。"},{term:"funds", pos:"n.", gloss:"資金（公司或機構的款項）（embezzle／misappropriate funds 挪用資金）。相關：theft 偷竊／embezzlement 侵占公款／audit 查帳。"}]},

        { n:12, kind:"形容詞",
          stem:"So __________ was the surgeon on the elaborate procedure at hand that not even a sudden power failure could distract her for a second.",
          options:{A:"mad 發瘋的；生氣的",B:"severe 嚴重的、嚴厲的",C:"complex 複雜的",D:"intent 專注的、一心一意的"}, answer:"D",
          translation:"這位外科醫師對手上這場精細的手術專注到如此程度，就連突然停電都無法讓她分心一秒。",
          explain:{D:"✔ 決定性的線索是介系詞 on：be intent on sth（專注於某事）是固定搭配，四個選項中只有 intent 接 on；而結果子句 not even a sudden power failure could distract her（連停電都無法讓她分心）更確認是極度專注。",A:"✘ mad 的搭配是 be mad at sb（對某人生氣）或 be mad about sth（著迷），介系詞都不是 on。",B:"✘ severe 是「嚴重、嚴厲的」，修飾病情、處罰或天氣，不與 on 搭配描述人的專注。",C:"✘ complex 是「複雜的」，應該用來修飾 procedure（手術）而非 the surgeon（醫師本人），主詞對不上。"},
          notes:[{term:"be intent on", pos:"片語", gloss:"專注於、決心要（be intent on winning／on the task at hand）。adj. intent 另可指眼神「專注的」（an intent gaze）；n. intent 意圖（with intent to defraud 意圖詐欺）；adv. intently 專注地。另一份 10-2~11 小考第 2 題把 intent 放在誘答，考的正是這個介系詞。", ex:"She was so intent on her work that she forgot to eat.", exZh:"她專注於工作，忘了吃飯。"},{term:"So + adj. + be + S + that…", pos:"句型", gloss:"倒裝強調句：So intent was the surgeon… that…（＝The surgeon was so intent… that…）。本卷第 21 題的 No sooner had…than 與第 34 題的 Had it not been for 也都是倒裝。"},{term:"at hand", pos:"片語", gloss:"手邊的、眼前的（the task／matter at hand）；也指「即將到來」（Help is at hand.）。對照 on hand 現有的、在場的。"}]},

        { n:13, kind:"動詞（過去式）",
          stem:"Despite following every piece of advice their doctor gave in advance, several volunteers __________ malaria while working in an exotic rainforest notorious for its mosquitoes.",
          options:{A:"infected 使感染（他人）",B:"vomited 嘔吐",C:"shrugged 聳肩",D:"contracted 感染（疾病）；簽約；收縮"}, answer:"D",
          translation:"儘管事前完全遵照醫師的每一項建議，仍有幾名志工在一座以蚊子惡名昭彰的熱帶雨林工作時感染了瘧疾。",
          explain:{D:"✔ 空格後直接接疾病名 malaria（瘧疾），需要一個「人染上病」且及物的動詞；contract a disease 是正式用法，正好對應。",A:"✘ infect 的方向相反：是病原或帶原者 infect 別人（be infected with malaria 才是人被感染）。說志工 infected malaria 會變成「志工感染了瘧疾（這個疾病）」，主受詞關係顛倒，這是本題最關鍵的辨析。",B:"✘ vomit 是「嘔吐」，不及物，不能接 malaria 當受詞。",C:"✘ shrug 是「聳肩」，受詞是 shoulders，與染病無關。"},
          notes:[{term:"contract / infect / come down with", pos:"辨析", gloss:"contract a disease 染病（正式，較重的病）／be infected with sth 被感染（人當受詞）／come down with sth 染上（較輕的病，如感冒；另一份小考第 18 題考過）／be diagnosed with sth 被確診。", ex:"He contracted malaria during his posting in West Africa.", exZh:"他在西非駐派期間感染了瘧疾。"},{term:"notorious", pos:"adj.", gloss:"惡名昭彰的（be notorious for sth；a notorious criminal）。n. notoriety。對照 famous／renowned 是褒義，notorious 與 infamous 是貶義。"},{term:"in advance", pos:"片語", gloss:"事先、預先（book in advance／pay in advance／two weeks in advance）。相關：beforehand 事前／prior to 在…之前。"}]},

        { n:14, kind:"名詞",
          stem:"The general's brilliant __________, such as deploying small units at night to break the siege, enabled his outnumbered army to defeat a massive hostile force.",
          options:{A:"tactics 戰術、具體手段",B:"superstitions 迷信",C:"characteristics 特徵、特色",D:"beliefs 信念"}, answer:"A",
          translation:"這位將軍高明的戰術（例如在夜間部署小型部隊突破圍城）讓他人數劣勢的軍隊打敗了龐大的敵軍。",
          explain:{A:"✔ such as 後面舉的例子 deploying small units at night to break the siege（夜間部署小部隊突圍）是具體的作戰手段，正是 tactics；而 enabled…to defeat（使得以擊敗）說明這些手段有效。",B:"✘ superstitions 是「迷信」，與理性的作戰規劃相反，也不能被 brilliant 肯定。",C:"✘ characteristics 是「特徵」，描述人或事物的性質，不是可以執行的作戰方法。",D:"✘ beliefs 是「信念」，是心中的看法，無法直接用來突破圍城。"},
          notes:[{term:"tactic / strategy", pos:"辨析", gloss:"tactic 戰術（達成目標的具體手段，常用複數 tactics：delaying tactics 拖延戰術／scare tactics 恐嚇手段）／strategy 戰略（整體長期的規劃）。adj. tactical 戰術的（a tactical retreat 戰術性撤退）／strategic 戰略的。另一份小考第 7 題把 tactic 放在誘答。", ex:"The campaign relied on aggressive social media tactics.", exZh:"這場選戰靠的是積極的社群媒體戰術。"},{term:"siege", pos:"n.", gloss:"圍城、圍困（lay siege to a city 圍攻／break a siege 解圍／be under siege 遭圍困）。相關：besiege 圍攻／blockade 封鎖。"},{term:"outnumbered", pos:"adj.", gloss:"人數上處於劣勢的（be heavily outnumbered）。v. outnumber 數量上超過（The enemy outnumbered them three to one.）。"}]},

        { n:15, kind:"形容詞",
          stem:"Because their natural defenses remain deficient for several months after birth, newborns are particularly __________ to infections that pose only a minimal hazard to adults.",
          options:{A:"immune 免疫的；不受影響的",B:"allergic 過敏的",C:"vulnerable 易受侵害的、脆弱的",D:"contagious 傳染力強的"}, answer:"C",
          translation:"由於新生兒出生後數個月內天生的防禦力仍然不足，他們特別容易受到那些對成人只構成極小危害的感染所侵襲。",
          explain:{C:"✔ 原因子句 their natural defenses remain deficient（免疫防禦仍不足）說明抵抗力弱，而 infections that pose only a minimal hazard to adults（對成人危害極小的感染）更凸顯對比，正是 be vulnerable to（易受…侵害）。",A:"✘ immune 的介系詞雖也是 to，但語意是「免疫、不受影響」，與 defenses remain deficient（防禦不足）完全相反，是本題最大的陷阱；本卷第 37 題才是 immune 的題目。",B:"✘ allergic 是「過敏的」，指免疫系統對無害物質過度反應，與被病原感染是不同機制。",D:"✘ contagious 是「（疾病）傳染力強的」，主詞應是疾病而非人；說新生兒 contagious 會變成「新生兒會傳染給別人」，語意顛倒。"},
          notes:[{term:"vulnerable", pos:"adj.", gloss:"易受侵害的、脆弱的（be vulnerable to infection／attack／criticism；vulnerable groups 弱勢族群）。n. vulnerability。另一份 10-2~11 小考第 23 題考過，當時的主詞是沒更新的舊電腦。", ex:"Elderly patients are especially vulnerable to the virus.", exZh:"年長病患特別容易受到這種病毒侵害。"},{term:"接 to 的三個形容詞", pos:"整理", gloss:"be vulnerable to 易受侵害（第 15 題）／be immune to 不受影響（第 37 題）／be prone to 容易發生。三者都接 to 但語意不同，本卷把前兩個拆成兩題對照考。"},{term:"deficient", pos:"adj.", gloss:"不足的、缺乏的（be deficient in vitamin D／deficient defenses）。n. deficiency 缺乏（a nutritional deficiency）；對照 deficit 赤字、逆差。"}]},

        { n:16, kind:"名詞",
          stem:"My father has been on __________ for high blood pressure for years; swallowing two small pills with breakfast has become an indispensable morning ritual.",
          options:{A:"prescription 處方（箋）",B:"medication 藥物（治療）",C:"shot 打針、一劑注射",D:"cough 咳嗽"}, answer:"B",
          translation:"我父親多年來一直在服藥控制高血壓；配早餐吞下兩顆小藥丸，已成為每天早上不可或缺的例行動作。",
          explain:{B:"✔ be on medication（正在用藥、接受藥物治療）是固定搭配，表示長期規律服藥；分號後面 swallowing two small pills with breakfast（配早餐吞兩顆藥丸）正是這個狀態的具體描述。",A:"✘ prescription 是「處方箋」那張文件（have／fill a prescription）；be on prescription 的意思是「某藥需憑處方才能取得」，主詞是藥而不是人，與「父親長期服藥」不同。",C:"✘ shot 是「打針」，是單次的注射動作，與每天口服藥丸矛盾。",D:"✘ cough 是「咳嗽」，是症狀，不能說 be on a cough。"},
          notes:[{term:"be on medication", pos:"片語", gloss:"正在服藥（be on medication for sth／be on antibiotics）。n. medication 藥物（多為不可數）。另一份 10-2~11 小考第 7 題考過這個字，當時的線索是 prescribe 與 side effects。", ex:"She's been on medication for anxiety since last spring.", exZh:"她從去年春天起就一直在服藥治療焦慮。"},{term:"indispensable", pos:"adj.", gloss:"不可或缺的（be indispensable to sb／sth；注意字尾是 -able 不是 -ible）。反義 dispensable 可省去的。"},{term:"ritual", pos:"n. / adj.", gloss:"例行的儀式、習慣性動作（a morning ritual／a religious ritual）。adj. 儀式性的。相關：routine 例行事務／habit 習慣。"}]},

        { n:17, kind:"動詞（過去式）",
          stem:"Ignoring her physiotherapist's explicit words of caution, Amy __________ in training on her injured ankle every day until she finally tore a ligament.",
          options:{A:"lasted 持續（不及物，不接 in）",B:"persisted 執意繼續（persist in V-ing）",C:"assumed 假定；承擔",D:"schemed 謀劃"}, answer:"B",
          translation:"Amy 不理物理治療師明確的警告，每天仍執意用受傷的腳踝訓練，最後終於拉斷了韌帶。",
          explain:{B:"✔ 空格後是 in training（介系詞 in＋動名詞），而 persist in V-ing（執意繼續做）正是這個搭配；前面 Ignoring…words of caution（不理警告）與後面 until she finally tore a ligament（直到拉斷韌帶）都呼應「不聽勸硬要做下去」的語氣。",A:"✘ last 是「持續」，主詞通常是事件或時間（The meeting lasted two hours.），不接 in，也不能以人為主詞表示「堅持做某事」。",C:"✘ assume 是「假定」或「承擔（職責）」，不接 in V-ing。",D:"✘ scheme 是「謀劃」（scheme to V／against sb），語意是策畫詭計，與硬撐訓練無關。"},
          notes:[{term:"persist", pos:"v.", gloss:"① persist in V-ing 執意繼續做（persist in smoking／in denying it）② （症狀、問題）持續存在（If the pain persists…；另一份小考第 10 題考的是這個用法）。n. persistence；adj. persistent 持續的、固執的。", ex:"He persisted in asking questions no one wanted to answer.", exZh:"他執意不斷追問沒人想回答的問題。"},{term:"explicit", pos:"adj.", gloss:"明確的、清楚說出的（explicit instructions／warnings）。反義 implicit 隱含的。adv. explicitly。另一份小考的測驗一也考過這個字的拼寫。"},{term:"ligament", pos:"n.", gloss:"韌帶（tear a ligament 拉斷韌帶）。相關：tendon 肌腱／sprain 扭傷／cartilage 軟骨／physiotherapist 物理治療師。"}]},

        { n:18, kind:"名詞",
          stem:"Grilled squid with a distinctive smoky sauce is the __________ of this legendary night market, attracting tourists who happily queue for an hour to taste it.",
          options:{A:"trait （人格）特質",B:"idea 想法",C:"creativity 創造力",D:"specialty 招牌菜、特色名產"}, answer:"D",
          translation:"淋上獨特煙燻醬汁的炭烤魷魚是這個傳奇夜市的招牌，吸引觀光客甘願排一小時的隊來嚐。",
          explain:{D:"✔ 主詞是一道具體的食物（Grilled squid…），而它讓觀光客願意排一小時隊，正是這個夜市最具代表性的「招牌菜」，specialty 完全對應。",A:"✘ trait 是「人格特質」（a personality trait），用於描述人的性格，不能指一道菜。",B:"✘ idea 是「想法」，抽象概念，一道菜不是一個想法。",C:"✘ creativity 是「創造力」，是能力而非具體產品，也不能被排隊品嚐。"},
          notes:[{term:"specialty", pos:"n.", gloss:"招牌菜、特色產品、專長（the chef's specialty／a local specialty 地方名產／My specialty is contract law.）。英式拼 speciality。另一份 10-2~11 小考第 37 題把它放在誘答。", ex:"Oyster omelet is the specialty of this stall.", exZh:"蚵仔煎是這個攤子的招牌。"},{term:"distinctive", pos:"adj.", gloss:"獨特的、有辨識度的（a distinctive flavor／voice／style）。注意與 distinct（明顯的、不同的）區別：a distinct improvement 明顯的進步。"},{term:"queue", pos:"v. / n.", gloss:"排隊（英式）（queue for an hour／queue up；美式用 line up／wait in line）。n. 隊伍（jump the queue 插隊）。"}]},

        { n:19, kind:"形容詞",
          stem:"Jeff has lost all credibility with his colleagues; a __________ liar, he exaggerates even trivial details when the truth would serve him far better.",
          options:{A:"chronic 一再犯的、根深柢固的；慢性的",B:"simple 單純的、簡單的",C:"worldly 世故的、歷練深的",D:"focused 專注的"}, answer:"A",
          translation:"Jeff 在同事之間已經完全失去可信度；他是個慣性說謊的人，連雞毛蒜皮的細節都要誇大，即使說實話對他有利得多。",
          explain:{A:"✔ chronic 除了醫學上的「慢性」，也用來形容「屢犯不改、根深柢固」的人或問題，a chronic liar（慣性說謊者）是標準搭配；後面 exaggerates even trivial details（連小細節都誇大）正說明這是長期不改的習性。",B:"✘ simple 是「單純的」，a simple liar 不成搭配，也無法解釋「連實話有利時都還要說謊」的頑固。",C:"✘ worldly 是「世故的」，指閱歷豐富（本卷第 5 題的語意家族），與說謊習性無關。",D:"✘ focused 是「專注的」，是正面評價，與失去可信度矛盾。"},
          notes:[{term:"chronic 的兩種用法", pos:"辨析", gloss:"① 慢性的（chronic pain／illness）② 屢犯不改、長期嚴重的（a chronic liar／a chronic shortage 長期短缺／chronic unemployment）。本卷第 8 題考的是它的反義字 acute，兩題互為對照。adv. chronically。", ex:"The company faces a chronic shortage of skilled workers.", exZh:"該公司面臨技術工人長期短缺的問題。"},{term:"credibility", pos:"n.", gloss:"可信度（lose／gain credibility；a credibility gap 信任落差）。adj. credible 可信的；對照 credulous 容易輕信的、incredible 難以置信的。"},{term:"trivial", pos:"adj.", gloss:"微不足道的、瑣碎的（a trivial matter／detail）。n. trivia 瑣事、冷知識；v. trivialize 使顯得無關緊要。"}]},

        { n:20, kind:"動詞（過去式）",
          stem:"Years of being scorned by aggressive classmates __________ him so deeply that even now, as a confident lawyer, he freezes whenever someone laughs behind him.",
          options:{A:"tightened 使變緊、繃緊",B:"continued 繼續",C:"scarred 使留下（心理）創傷",D:"mumbled 含糊地說"}, answer:"C",
          translation:"多年來被強勢同學嘲弄，在他心裡留下極深的創傷，以致於即使如今已是個自信的律師，只要有人在背後發笑他就會僵住。",
          explain:{C:"✔ scar 當動詞除了「留下疤痕」，更常用於心理層面的「留下創傷」（be scarred by sth）；結果子句 even now…he freezes whenever someone laughs behind him（現在聽到背後笑聲還會僵住）正是長期心理陰影的表現。",A:"✘ tighten 是「使變緊」，受詞是螺絲、繩索或規定（tighten the rules），不能接人表達心理傷害。",B:"✘ continue 是「繼續」，continued him 語意不通，也無法導出 so deeply that 的結果。",D:"✘ mumble 是「含糊地說」，受詞是話語（本卷第 9 題考的就是它的名詞），不能接人。"},
          notes:[{term:"scar", pos:"v. / n.", gloss:"v. 使留下疤痕或創傷（be scarred for life／emotionally scarred）／n. 疤痕（leave a scar）。adj. scarred。另一份 10-2~11 小考第 9、40 題都把它放在誘答位置。", ex:"The war left a generation deeply scarred.", exZh:"那場戰爭讓整整一代人留下深刻的創傷。"},{term:"scorn", pos:"v. / n.", gloss:"v. 輕蔑、嘲弄（be scorned by sb／scorn an offer 不屑接受）／n. 輕蔑（pour scorn on sth 大加嘲諷）。adj. scornful。相關：ridicule 譏笑／mock 嘲笑／bully 霸凌。"},{term:"freeze", pos:"v.", gloss:"此處指「（因恐懼）僵住、動不了」（I just froze.）；也指結凍、凍結（freeze assets 凍結資產）。三態 freeze-froze-frozen。"}]},

        { n:21, kind:"名詞",
          stem:"No sooner had the live __________ of the final gone on the air than a storm disrupted the signal, causing interference that ruined the most exciting segment.",
          options:{A:"diagnosis 診斷（結果）",B:"scan 掃描檢查",C:"transmission 播送、傳輸；傳播",D:"epidemic 流行病、疫情"}, answer:"C",
          translation:"決賽的實況轉播才剛上線播出，一場暴風雨就干擾了訊號，造成雜訊，毀了最精采的那一段。",
          explain:{C:"✔ 三個線索都屬廣播領域：live（實況的）、gone on the air（開始播出）、disrupted the signal（干擾訊號）。transmission 正是「播送、訊號傳輸」，a live transmission 是標準說法。",A:"✘ diagnosis 是「診斷結果」，醫療用語，不會 go on the air。",B:"✘ scan 是「掃描檢查」，雖然醫學影像也會傳輸，但 a live scan of the final（決賽的實況掃描）語意荒謬。",D:"✘ epidemic 是「疫情」，不會被播送，也不會因暴風雨而訊號中斷。"},
          notes:[{term:"transmission", pos:"n.", gloss:"① 播送、傳輸（a live transmission／data transmission）② （疾病的）傳播（the transmission of the virus）③ （汽車）變速箱。v. transmit 播送、傳染。另一份 10-2~11 小考第 30 題把它放在誘答。", ex:"Heavy rain interrupted the live transmission from the stadium.", exZh:"大雨中斷了從球場發出的實況轉播。"},{term:"No sooner had S p.p. than…", pos:"句型", gloss:"「才剛…就…」。否定副詞 No sooner 置句首必須倒裝，主句用過去完成式、than 子句用過去式。注意搭配的是 than 不是 when（Hardly／Scarcely 才搭 when）。"},{term:"on the air", pos:"片語", gloss:"（節目）正在播出（go on the air 開播／be on the air）。反義 off the air 停播。相關：broadcast 播送／live 實況的／interference 雜訊干擾。"}]},

        { n:22, kind:"形容詞",
          stem:"The usually playful host turned __________ as he interrupted his commentary to deliver the grim news that the plane carrying the national team had crashed.",
          options:{A:"sober 嚴肅冷靜的；沒喝酒的",B:"witty 機智幽默的",C:"drunk 喝醉的",D:"mean 小氣的、刻薄的"}, answer:"A",
          translation:"這位平時愛開玩笑的主持人神色一轉變得嚴肅，中斷了他的球評，宣布載著國家隊的飛機墜毀這個沉重的消息。",
          explain:{A:"✔ sober 除了「沒喝酒」，更常用於「神情嚴肅、語氣凝重」；The usually playful host（平時愛鬧的主持人）與 grim news（沉重消息）形成前後反差，正需要這個轉折，turn sober 完全對應。",B:"✘ witty 是「機智幽默」，與宣布空難消息的場合完全不合，也不構成 usually playful 的轉變。",C:"✘ drunk 是「喝醉」，播報途中突然喝醉在邏輯上不成立，而且與沉重消息無關。",D:"✘ mean 是「刻薄、小氣」，描述待人態度，不能表達面對悲訊的凝重。"},
          notes:[{term:"sober 的兩個語意", pos:"辨析", gloss:"① 沒喝酒的、清醒的（stay sober；另一份 10-2~11 小考第 8 題考的是這個義）② 嚴肅冷靜的、不帶情緒的（turn sober／a sober assessment 冷靜的評估／a sober reminder 令人警醒的提醒）。n. sobriety。", ex:"His speech struck a sober note after weeks of celebration.", exZh:"在數週的慶祝之後，他的演說帶來了一記凝重的提醒。"},{term:"grim", pos:"adj.", gloss:"嚴峻的、令人沮喪的（grim news／a grim outlook／look grim）。adv. grimly。相關：bleak 慘淡的／dire 悲慘的／somber 陰鬱莊重的。"},{term:"commentary", pos:"n.", gloss:"（體育）賽評、評論（live commentary／a running commentary 連續不斷的實況評述）。n. commentator 評論員；v. comment 評論。"}]},

        { n:23, kind:"名詞",
          stem:"Thanks to cleaner water and widespread vaccination, the country has seen an unprecedented decline in __________, with far fewer people dying before the age of five.",
          options:{A:"digestion 消化",B:"allergy 過敏（症）",C:"genetics 遺傳學",D:"mortality 死亡率"}, answer:"D",
          translation:"由於水質改善與疫苗普及，這個國家的死亡率出現前所未有的下降，五歲前死亡的人數大幅減少。",
          explain:{D:"✔ 句尾 with far fewer people dying before the age of five（五歲前死亡的人數大幅減少）就是定義性的說明，正是 mortality（死亡率）；infant／child mortality 是公共衛生的核心指標。",A:"✘ digestion 是「消化」，是生理過程，不會有 decline in digestion 這種公共衛生統計。",B:"✘ allergy 是「過敏症」，與乾淨飲水、疫苗接種以及幼兒死亡的因果鏈無關。",C:"✘ genetics 是「遺傳學」，是一門學科，不會上升或下降。"},
          notes:[{term:"mortality", pos:"n.", gloss:"① 死亡率（the infant／child mortality rate）② 必死性（face one's own mortality 意識到自己終將一死）。adj. mortal 終將死亡的、致命的（a mortal wound）。另一份 10-2~11 小考第 7 題把它放在誘答。", ex:"Child mortality has fallen by half in two decades.", exZh:"兒童死亡率在二十年間下降了一半。"},{term:"unprecedented", pos:"adj.", gloss:"前所未有的（an unprecedented decline／on an unprecedented scale）。n. precedent 先例（set a precedent 開先例）。"},{term:"vaccination", pos:"n.", gloss:"疫苗接種（widespread vaccination／a vaccination program）。n. vaccine 疫苗；v. vaccinate（vaccinate sb against sth）。相關：immunity 免疫力／herd immunity 群體免疫。"}]},

        { n:24, kind:"動詞（過去式）",
          stem:"Several vocal parents __________ to the school's plan to install classroom cameras, signing a petition that called the constant surveillance an invasion of privacy.",
          options:{A:"rejected 拒絕、駁回（及物，不接 to）",B:"objected 反對（object to sth）",C:"muttered 低聲抱怨",D:"qualified 使具備資格"}, answer:"B",
          translation:"幾位勇於發聲的家長反對校方在教室安裝攝影機的計畫，並連署請願書，稱這種持續監控是侵犯隱私。",
          explain:{B:"✔ 決定性線索是空格後的介系詞 to：object to sth（反對某事）是固定搭配，而 signing a petition…an invasion of privacy（連署稱其侵犯隱私）正是反對的行動與理由。",A:"✘ reject 語意雖近，但它是及物動詞，後面直接接受詞（reject the plan），不能接 to，這是本題的文法關鍵。",C:"✘ mutter 是「低聲抱怨」，受詞是話語，而且它的搭配是 mutter about sth；更重要的是連署請願是公開行動，與「低聲嘟嚷」的語氣相反。",D:"✘ qualify 是「使具備資格」（qualify sb for sth），語意與反對完全無關。"},
          notes:[{term:"object to", pos:"片語", gloss:"反對（object to sth／to V-ing：I object to being treated like this.）。n. objection 異議（raise an objection）；adj. objectionable 令人反感的。注意名詞 object（物體、目標）重音在前，動詞重音在後。", ex:"Residents objected to the plan on environmental grounds.", exZh:"居民以環保理由反對這項計畫。"},{term:"vocal", pos:"adj.", gloss:"此處指「公開發聲的、敢直言的」（a vocal critic／vocal opposition）；也指「聲音的」（vocal cords 聲帶）。adv. vocally。"},{term:"surveillance", pos:"n.", gloss:"監視、監控（under surveillance 受到監視／surveillance cameras 監視器）。相關：privacy 隱私／invasion of privacy 侵犯隱私／monitor 監看。"}]},

        { n:25, kind:"名詞",
          stem:"After the marathon, each runner was offered an optional ten-minute __________ to loosen leg muscles that had grown painfully rigid during the final kilometers.",
          options:{A:"massage 按摩",B:"pulse 脈搏",C:"vein 靜脈、血管",D:"symptom 症狀"}, answer:"A",
          translation:"馬拉松結束後，每位跑者都可以選擇接受十分鐘的按摩，以放鬆在最後幾公里變得僵硬疼痛的腿部肌肉。",
          explain:{A:"✔ 目的是 to loosen leg muscles（放鬆腿部肌肉），而 a ten-minute（為時十分鐘的）說明這是一項有時長的服務項目，正是 massage。",B:"✘ pulse 是「脈搏」，是生理指標，可以測量但不能「提供十分鐘的脈搏」來放鬆肌肉。",C:"✘ vein 是「靜脈」，是身體構造，同樣無法被提供。",D:"✘ symptom 是「症狀」，而且症狀是要被緩解的對象，不是用來放鬆肌肉的手段。"},
          notes:[{term:"massage", pos:"n. / v.", gloss:"n. 按摩（have／give a massage／a sports massage）／v. 按摩（massage one's shoulders）；另有「美化數據」之義（massage the figures）。另一份 10-2~11 小考第 30、32 題都把它放在誘答。", ex:"A short massage after training speeds up recovery.", exZh:"訓練後短暫的按摩能加快恢復。"},{term:"rigid", pos:"adj.", gloss:"僵硬的、死板的（rigid muscles／rigid rules／a rigid structure）。n. rigidity；adv. rigidly。對照 flexible 有彈性的。"},{term:"loosen", pos:"v.", gloss:"放鬆、鬆開（loosen muscles／one's tie／loosen up 暖身或放鬆心情）。反義 tighten 使變緊（本卷第 20 題的誘答）。"}]},

        { n:26, kind:"形容詞",
          stem:"Because the disorder is __________, people whose parents suffered from it face far higher odds of developing it themselves and are advised to take precautions early.",
          options:{A:"temporary 暫時的",B:"moral 道德的",C:"genetic 基因的、遺傳的",D:"cautious 謹慎的"}, answer:"C",
          translation:"由於這種疾病與基因有關，父母曾罹患的人自己發病的機率高出許多，因此建議及早採取預防措施。",
          explain:{C:"✔ people whose parents suffered from it face far higher odds of developing it themselves（父母得過的人自己罹病機率高很多）說明疾病會沿家族傳遞，正是 genetic（遺傳的）。",A:"✘ temporary 是「暫時的」，描述持續時間，無法解釋為何與父母的病史相關。",B:"✘ moral 是「道德的」，疾病沒有道德屬性。",D:"✘ cautious 是「謹慎的」，修飾人的態度（be cautious about sth），不能修飾疾病；句中要謹慎的是患者家屬（take precautions），不是疾病本身。"},
          notes:[{term:"genetic", pos:"adj.", gloss:"基因的、遺傳的（a genetic disorder／genetic testing／genetically modified 基因改造的）。n. gene 基因／n. genetics 遺傳學（本卷第 23 題的誘答）／adv. genetically。另一份 10-2~11 小考第 31 題把它放在誘答。", ex:"The condition has a strong genetic component.", exZh:"這個病症有很強的遺傳成分。"},{term:"odds", pos:"n.", gloss:"機率、勝算（face higher odds／the odds are against us／against all odds 在極不利的情況下）。注意恆用複數。"},{term:"take precautions", pos:"片語", gloss:"採取預防措施（take precautions against sth／as a precaution 以防萬一）。adj. precautionary 預防性的。"}]},

        { n:27, kind:"名詞",
          stem:"Grandpa's fishing __________, including rods, hooks, and reels packed in a sturdy wooden box, is the only legacy he left me, and it remains perfectly intact.",
          options:{A:"herb 草藥、香草",B:"tackle 釣具、裝備（不可數）",C:"skull 顱骨、頭骨",D:"morality 道德（觀）"}, answer:"B",
          translation:"爺爺的釣具——包括收在一只堅固木箱裡的釣竿、魚鉤和捲線器——是他留給我唯一的遺產，而且至今保存得完好無缺。",
          explain:{B:"✔ including rods, hooks, and reels（包括釣竿、魚鉤、捲線器）把答案定義得非常明確：這些都是釣魚裝備，fishing tackle 正是「釣具」的固定說法，而且是不可數名詞，所以動詞用單數 is。",A:"✘ herb 是「草藥」，與釣竿魚鉤無關，而且它可數，前面需要冠詞。",C:"✘ skull 是「顱骨」，身體構造，不可能裝在工具箱裡當遺產（語意荒謬）。",D:"✘ morality 是「道德」，抽象概念，不能包含釣竿與魚鉤這些實體物品。"},
          notes:[{term:"tackle 的名詞與動詞", pos:"辨析", gloss:"n. 釣具、裝備（fishing tackle，不可數）／n. 運動的「攔截鏷球」／v. 著手處理（tackle a problem；另一份 10-2~11 小考第 25 題考的是這個動詞義，本卷第 31 題也把它放在誘答）。", ex:"He keeps all his tackle in a shed by the river.", exZh:"他把所有釣具都放在河邊的小屋裡。"},{term:"legacy", pos:"n.", gloss:"遺產、留下的影響（leave a legacy／a lasting legacy）。注意它可指實物遺產，也常指抽象的影響。相關：heritage 文化遺產／inherit 繼承／heirloom 傳家寶。"},{term:"intact", pos:"adj.", gloss:"完好無損的（remain／survive intact；keep sth intact）。注意它通常作主詞補語，不放在名詞前。"}]},

        { n:28, kind:"動詞（過去式）",
          stem:"Before signing the insurance policy, Kelly __________ every clause, searching for obscure conditions that might limit her coverage or hide extra premiums.",
          options:{A:"recited 背誦、朗誦",B:"disabled 使失效、使無法運作",C:"massaged 按摩",D:"scanned 逐條細看、掃視查找"}, answer:"D",
          translation:"在簽下保單之前，Kelly 逐條細看每一項條款，搜尋可能限制她的理賠範圍或隱藏額外保費的隱晦條件。",
          explain:{D:"✔ scan 指「用眼睛快速而有目的地查找」，而分詞片語 searching for obscure conditions（搜尋隱晦的條件）正說明她是帶著目標在條文中掃視，與 every clause 搭配完全自然。",A:"✘ recite 是「背誦、朗誦」，是把文字唸出或默出，但 Kelly 的目的是找出陷阱而不是背下條文。",B:"✘ disable 是「使失效」，簽約前的讀者沒有權力讓條款失效，語意與時序都不合。",C:"✘ massage 是「按摩」（本卷第 25 題的正解），雖有 massage the figures（美化數據）的引申義，但受詞是數據而非條款，也與「尋找隱藏條件」相反。"},
          notes:[{term:"scan", pos:"v. / n.", gloss:"① 掃視、快速查找（scan the headlines／scan a document for errors）② 掃描（scan a photo／have a brain scan；本卷第 21 題把名詞義放在誘答）。n. scanner 掃描器。", ex:"She scanned the contract for any mention of penalties.", exZh:"她在合約中掃視查找任何提到罰款的地方。"},{term:"clause", pos:"n.", gloss:"（合約的）條款（a clause in the contract／an escape clause 免責條款）；文法上指「子句」。相關：policy 保單／premium 保費／coverage 保障範圍／deductible 自付額。"},{term:"obscure", pos:"adj. / v.", gloss:"adj. 隱晦難懂的、不知名的（an obscure clause／an obscure poet）／v. 遮蔽、使模糊（Clouds obscured the moon.）。n. obscurity。"}]},

        { n:29, kind:"名詞",
          stem:"As severe food shortages spread across the barren region, thousands of children are suffering from __________, and many are too weak to walk.",
          options:{A:"nutrition 營養（學）",B:"fever 發燒",C:"malnutrition 營養不良",D:"headache 頭痛"}, answer:"C",
          translation:"隨著嚴重的糧食短缺蔓延到這片貧瘠的地區，數千名兒童正受營養不良之苦，許多人虛弱到無法行走。",
          explain:{C:"✔ severe food shortages（嚴重糧食短缺）是原因，too weak to walk（虛弱到不能走）是結果，中間的病症只能是 malnutrition（營養不良）；字首 mal- 即「不良」。",A:"✘ nutrition 是「營養」本身，是中性的好事；suffer from nutrition（受營養之苦）語意顛倒，這是本題的關鍵陷阱——要用加了 mal- 的負面字。",B:"✘ fever 是「發燒」，是感染的徵狀，與糧食短缺沒有直接因果。",D:"✘ headache 是「頭痛」，無法解釋 too weak to walk 的全身性虛弱。"},
          notes:[{term:"字首 mal-＝不良、錯誤", pos:"字首", gloss:"malnutrition 營養不良／malfunction 故障／malpractice 專業過失（medical malpractice 醫療過失）／maltreat 虐待／malicious 惡意的。本題只要認出 mal- 就能排除 nutrition。", ex:"Chronic malnutrition stunts children's growth.", exZh:"長期營養不良會使兒童發育遲緩。"},{term:"barren", pos:"adj.", gloss:"貧瘠的、荒蕪的（barren land／a barren landscape）；也指「不孕的」。相關：fertile 肥沃的／arid 乾旱的／famine 饑荒／drought 乾旱。"},{term:"too + adj. + to V", pos:"句型", gloss:"太…以致於不能…（too weak to walk／too good to be true）。注意本身已含否定意味，不可再加 not。"}]},

        { n:30, kind:"形容詞",
          stem:"Having stayed up drinking until dawn, Mark woke with a __________ headache and spent the afternoon in a dark room, in a foul mood.",
          options:{A:"vicious 猛烈的、來勢凶猛的；惡毒的",B:"mortal 終將死亡的；致命的",C:"sensible 明智的、通情達理的",D:"nutritious 有營養的"}, answer:"A",
          translation:"Mark 熬夜喝到天亮，起床時頭痛得厲害，整個下午都待在暗房裡，心情惡劣。",
          explain:{A:"✔ vicious 除了「惡毒的」，也用來形容疼痛或天候「來勢凶猛、很劇烈」；spent the afternoon in a dark room, in a foul mood（整個下午躲在暗房、心情惡劣）說明頭痛程度嚴重，a vicious headache 正是口語常見的搭配。",B:"✘ mortal 是「致命的」（a mortal wound），宿醉頭痛不致命，程度誇張到不合理。",C:"✘ sensible 是「明智的」，修飾人或決定，不能修飾頭痛。",D:"✘ nutritious 是「有營養的」，修飾食物，與頭痛完全無關。"},
          notes:[{term:"vicious", pos:"adj.", gloss:"① 凶猛的、劇烈的（a vicious headache／a vicious storm／a vicious dog）② 惡毒的（a vicious rumor／attack；另一份 10-2~11 小考第 31 題考的是這個義）。a vicious circle 惡性循環。", ex:"A vicious wind swept across the open field.", exZh:"一陣凶猛的強風掃過空曠的田野。"},{term:"stay up", pos:"片語動詞", gloss:"熬夜不睡（stay up late／stay up until dawn）。對照 sit up 坐起來／oversleep 睡過頭／pull an all-nighter 熬一整夜。"},{term:"foul", pos:"adj.", gloss:"惡劣的、難聞的（in a foul mood／foul weather／a foul smell）；運動上指「犯規」（n. a foul）。相關：hangover 宿醉。"}]},

        { n:31, kind:"動詞",
          stem:"When the chairman's sudden resignation left a power vacuum, Ms. Ho reluctantly agreed to __________ the administrative role of acting president until a successor emerged.",
          options:{A:"tackle 著手處理（難題）",B:"cripple 使癱瘓、使重創",C:"operate 操作；動手術；營運",D:"undertake 承擔（職責、任務）"}, answer:"D",
          translation:"董事長突然辭職留下權力真空，何女士勉強同意承擔代理董事長的行政職務，直到有繼任者出現為止。",
          explain:{D:"✔ 空格的受詞是 the administrative role（行政職務），而 undertake 正是「承擔（職責、任務）」的標準動詞；reluctantly agreed（勉強同意）也符合承擔重擔的語氣。",A:"✘ tackle 的受詞是「難題」而非「職務」（tackle a problem／the shortage），說 tackle a role 不成搭配——本卷第 27 題考的是 tackle 的名詞義，兩題可以互相對照。",B:"✘ cripple 是「使癱瘓」，受詞是經濟、系統或補給線，語意與接任完全相反。",C:"✘ operate 是「操作、營運」，受詞是機器或事業（operate a machine／a business），不能接 a role。"},
          notes:[{term:"undertake", pos:"v.", gloss:"承擔、著手進行（undertake a role／a task／research／repairs）；另有「保證」之義（undertake to V）。三態 undertake-undertook-undertaken；n. undertaking 事業、承諾。另一份 10-2~11 小考第 40 題考過，當時的受詞是 a risky project。", ex:"She undertook the role of interim director for six months.", exZh:"她承擔了為期六個月的代理主管職務。"},{term:"power vacuum", pos:"n.", gloss:"權力真空（leave／create a power vacuum）。相關：acting president 代理董事長或總裁／interim 過渡的／successor 繼任者／step down 卸任。"},{term:"reluctantly", pos:"adv.", gloss:"勉強地、不情願地（reluctantly agree／accept）。adj. reluctant（be reluctant to V）；n. reluctance。"}]},

        { n:32, kind:"名詞",
          stem:"Uncle Joe's __________ never fails to amuse us; even on his birthday, he insists that rain is inevitable and that the cake will, at best, taste stale.",
          options:{A:"optimism 樂觀（主義）",B:"pessimism 悲觀（主義）",C:"integrity 正直、操守",D:"stereotype 刻板印象"}, answer:"B",
          translation:"喬叔叔的悲觀總是讓我們覺得好笑；就連他生日那天，他都堅持一定會下雨，而且蛋糕頂多就是不新鮮的味道。",
          explain:{B:"✔ 分號後舉的例子就是定義：insists that rain is inevitable（堅持一定會下雨）、the cake will, at best, taste stale（蛋糕頂多就是不新鮮），凡事先想到最壞結果，正是 pessimism。",A:"✘ optimism 是「樂觀」，與「一定會下雨、蛋糕頂多難吃」的預期完全相反，是本題的反向陷阱。",C:"✘ integrity 是「正直、操守」，是道德品質，與對未來的預期無關。",D:"✘ stereotype 是「刻板印象」，指對群體的以偏概全，不是個人的性格傾向。"},
          notes:[{term:"pessimism / optimism", pos:"對照", gloss:"pessimism 悲觀（adj. pessimistic／n. pessimist 悲觀的人）／optimism 樂觀（adj. optimistic／n. optimist）。另一份 10-2~11 小考第 7 題把 pessimism 放在誘答、第 13 題用 optimism 當正解的同組字，本卷正好反過來考。", ex:"A mood of pessimism settled over the newsroom.", exZh:"一股悲觀的氣氛籠罩了新聞編輯室。"},{term:"never fail to V", pos:"片語", gloss:"總是、必定會（His jokes never fail to make me laugh.）。這是雙重否定表強烈肯定的常見句型。"},{term:"at best / at worst", pos:"片語", gloss:"充其量、頂多／最糟的情況下（The cake will at best taste stale.／At worst, we'll lose a day.）。相關：stale 不新鮮的、走味的／inevitable 不可避免的。"}]},

        { n:33, kind:"形容詞",
          stem:"Her enthusiasm was so __________ that within minutes the entire workshop, including the normally reserved instructor, was cheering and volunteering ideas.",
          options:{A:"serious 嚴肅的、嚴重的",B:"contagious 有感染力的；會傳染的",C:"inclined 有意願的、傾向於…的",D:"determined 有決心的"}, answer:"B",
          translation:"她的熱情極具感染力，幾分鐘之內整個工作坊——連平時拘謹的講師都包括在內——都開始歡呼並主動提出想法。",
          explain:{B:"✔ contagious 除了指疾病「會傳染」，也常比喻情緒「有感染力」；within minutes the entire workshop…was cheering（幾分鐘內全場都在歡呼），連 the normally reserved instructor（平時拘謹的講師）都被帶動，正是情緒擴散的畫面。",A:"✘ serious 是「嚴肅的」，與全場歡呼的熱烈氣氛相反。",C:"✘ inclined 是「傾向於」，必須接 to V（be inclined to agree），而且主詞須是有意願的人，不能修飾 enthusiasm。",D:"✘ determined 是「有決心的」，描述人的意志（be determined to V），無法解釋熱情如何擴散到全場。"},
          notes:[{term:"contagious 的兩個語意", pos:"辨析", gloss:"① （疾病）接觸傳染的（a highly contagious virus；另一份 10-2~11 小考第 27 題考的是這個義）② （情緒）有感染力的（contagious enthusiasm／laughter／a contagious smile）。n. contagion。", ex:"His laughter was so contagious that soon everyone joined in.", exZh:"他的笑聲太有感染力，很快大家都跟著笑了。"},{term:"reserved", pos:"adj.", gloss:"拘謹的、不外露的（a reserved person／normally reserved）；也指「已預訂的」（a reserved seat）。n. reserve 保留、儲備。對照 outgoing 外向的。"},{term:"volunteer", pos:"v.", gloss:"此處是「主動提出、自願」（volunteer ideas／volunteer to help／volunteer information 主動透露）。n. volunteer 志工（本卷第 13、40 題都出現這個名詞）。"}]},

        { n:34, kind:"名詞",
          stem:"Had it not been for a substantial __________ of cash from the government, the airline, whose revenue had collapsed during the pandemic, would have gone bankrupt.",
          options:{A:"nourishment 滋養、養分",B:"pressure 壓力",C:"injection 挹注；注射",D:"sign 徵象、標誌"}, answer:"C",
          translation:"要不是政府挹注了一大筆現金，這家在疫情期間營收崩跌的航空公司早就破產了。",
          explain:{C:"✔ a cash injection（現金挹注）是財經慣用語，指為瀕危企業注入資金；若非如此，結果就是 would have gone bankrupt（早就破產），因果關係完全吻合。",A:"✘ nourishment 是「滋養、養分」，屬營養語境，不用於資金。",B:"✘ pressure 是「壓力」，政府給的若是壓力，不會避免破產，語意方向相反。",D:"✘ sign 是「徵象」，a sign of cash 不成搭配，而且一個徵象無法救起一家航空公司。"},

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const wordOf = q => q.options ? q.options[q.answer] : (q.answerText || '');
const allQ = [];
EXAM.sections.forEach(s => s.groups.forEach(g => g.questions.forEach(q => { q.__sid = s.id; allQ.push(q); })));
const findQ = (n, sid) => allQ.find(q => String(q.n) === String(n) && (sid == null || q.__sid === sid));

document.getElementById('brand').textContent = EXAM.brand;
document.getElementById('examTitle').textContent = EXAM.title;
document.getElementById('examMeta').textContent = EXAM.meta;

let noteCount = 0;
allQ.forEach(q => noteCount += (q.notes || []).length);

const nav = document.getElementById('nav');
EXAM.sections.forEach(s => {
  const a = document.createElement('a');
  a.className = 'chip'; a.href = '#sec-' + s.id; a.textContent = s.label.replace(/^[一二三四五六]、/, m => m);
  nav.appendChild(a);
});
const noteChip = document.createElement('a');
noteChip.className = 'chip'; noteChip.href = '#side'; noteChip.textContent = '重點表 ' + noteCount;
nav.appendChild(noteChip);
const toggleAll = document.createElement('button');
toggleAll.className = 'chip solid'; toggleAll.textContent = '全部展開';
nav.appendChild(toggleAll);

function renderPassage(g, i, sid) {
  let html = esc(g.passage);
  g.questions.forEach(q => {
    if (!q.evidence) return;
    const t = esc(q.evidence);
    if (html.includes(t)) html = html.replace(t, `<span class="hl ev" data-ev="${q.n}">${t}</span>`);
  });
  html = html.replace(/__(\d+)__/g, (m, n) =>
    `<button class="blank" data-blank="${n}" aria-label="第 ${n} 題空格">${n}</button>`);
  const body = '<div class="passage">' +
    html.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, ' ') + '</p>').join('') + '</div>';
  if (!g.zh) return body;
  const id = sid + '-' + i;
  return body +
    `<button class="zhbtn" data-zh="${id}">全文中譯</button>` +
    `<div class="zhbox" id="zh-${id}">` +
      g.zh.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, ' ') + '</p>').join('') +
    '</div>';
}

function renderQ(q) {
  const parts = [];
  if (q.options) {
    const ks = Object.keys(q.options);
    parts.push('<div class="opts">' + ks.map(k =>
      `<div class="opt"><span class="opt-k">(${k})</span><span>${esc(q.options[k])}</span></div>`).join('') + '</div>');
  }
  const head = `<div class="q-tag"><span class="q-n">${String(q.n).padStart(2,'0')}</span><span class="q-kind">${esc(q.kind || '')}</span></div>` +
    (q.prompt ? `<p class="prompt">${esc(q.prompt)}</p>` : '') +
    (q.stem ? `<p class="stem">${esc(q.stem).replace(/\n/g,'<br>')}</p>` : '');

  let ans = '';
  if (q.answers) {
    ans = '<ul class="fills">' + q.answers.map(a =>
      `<li class="fill"><span class="fill-k">${esc(a.k)}</span><span class="fill-w hl" data-ansmulti>${esc(a.w)}</span><span class="fill-n">${esc(a.note || '')}</span></li>`).join('') + '</ul>';
  } else {
    const label = q.options ? `(${q.answer}) ${esc(wordOf(q))}` :
      (q.answer ? `(${q.answer}) ${esc(q.answerText)}` : esc(q.answerText));
    ans = `<p class="ans"><span class="ans-k">答案</span><span class="ans-v hl" data-ans="${q.n}">${label}</span></p>`;
  }

  let expl = '';
  if (q.explain) {
    expl = '<ul class="lines">' + Object.keys(q.options).map(k => {
      const right = q.multi ? q.multi.includes(k) : k === q.answer;
      return `<li class="line ${right ? 'right' : 'wrong'}"><span class="line-k">(${k})</span><span>${esc(q.explain[k] || '')}</span></li>`;
    }).join('') + '</ul>';
  }
  const why = q.why ? `<p class="why">${esc(q.why)}</p>` : '';
  const sample = q.sample ? `<div class="sample"><p class="note-h">參考範文</p>` +
    q.sample.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g,' ')}</p>`).join('') + '</div>' : '';
  const evid = q.evidence ? `<p class="evid"><span>文中依據</span>${esc(q.evidence)}</p>` : '';
  const notes = (q.notes || []).length ? `<div class="note"><p class="note-h">重點整理</p>` +
    q.notes.map(nt => `<p class="note-i"><span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span><span class="gloss">${esc(nt.gloss || '')}</span>` +
      (nt.ex ? `<span class="ex">${esc(nt.ex)}<i>${esc(nt.exZh || '')}</i></span>` : '') + '</p>').join('') + '</div>' : '';

  return `<article class="q" id="q-${q.__sid}-${q.n}" data-n="${q.n}" data-sid="${q.__sid}">
    <div class="q-top">${head}${parts.join('')}
      <button class="reveal" aria-expanded="false" aria-controls="body-${q.n}">看詳解</button>
    </div>
    <div class="body" id="body-${q.n}">
      ${ans}${q.translation ? `<p class="zh">${esc(q.translation)}</p>` : ''}${expl}${why}${evid}${sample}${notes}
    </div>
  </article>`;
}

document.getElementById('main').innerHTML = EXAM.sections.map((s, i) => `

  <p class="side-note">點任一則可跳到出處題目。用瀏覽器列印（Ctrl／⌘ + P）會自動展開全部詳解與中譯，可直接印成講義。</p>`;

function setOpen(card, open) {
  card.classList.toggle('open', open);
  const btn = card.querySelector('.reveal');
  btn.setAttribute('aria-expanded', open);
  btn.firstChild.nodeValue = open ? '收合詳解' : '看詳解';
  const n = card.dataset.n;
  const sec = card.closest('.sec') || document;
  card.querySelectorAll('.hl').forEach(h => h.classList.toggle('on', open));
  const ev = sec.querySelector(`[data-ev="${n}"]`);
  if (ev) ev.classList.toggle('on', open);
  const q = findQ(n, card.dataset.sid);
  if (q && q.answer && q.answerText) {
    const bi = sec.querySelector(`[data-bank="${q.answer}"]`);
    if (bi) bi.classList.toggle('used', open);
  }
  const bl = sec.querySelector(`[data-blank="${n}"]`);
  if (bl) {
    if (open) {
      bl.classList.add('filled');
      bl.innerHTML = `<sup>${n}</sup><span class="hl">${esc(wordOf(q))}</span>`;
      requestAnimationFrame(() => bl.querySelector('.hl').classList.add('on'));
    } else {
      bl.classList.remove('filled');
      bl.textContent = n;
    }
  }
}
document.addEventListener('click', e => {
  const rv = e.target.closest('.reveal');
  if (rv) { const c = rv.closest('.q'); setOpen(c, !c.classList.contains('open')); return; }
  const zb = e.target.closest('.zhbtn');
  if (zb) { zb.classList.toggle('on'); document.getElementById('zh-' + zb.dataset.zh).classList.toggle('on'); return; }
  const bl = e.target.closest('.blank');
  if (bl) {
    const c = document.getElementById('q-' + bl.dataset.blank);
    if (!c.classList.contains('open')) setOpen(c, true);
    c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});
toggleAll.addEventListener('click', () => {
  const open = toggleAll.textContent === '全部展開';
  document.querySelectorAll('.q').forEach(c => setOpen(c, open));
  toggleAll.textContent = open ? '全部收合' : '全部展開';
});
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.q').forEach(c => setOpen(c, true));
  document.querySelectorAll('.zhbox').forEach(b => b.classList.add('on'));
  toggleAll.textContent = '全部收合';
});
</script>
</body>
</html>
